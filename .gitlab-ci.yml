variables:
  GOFLAGS: "-buildvcs=false"
  GOTOOLCHAIN: "local"
  CI_IMAGE: ${CI_REGISTRY_IMAGE}/ci:${CI_COMMIT_SHA}
  GOPATH: ${CI_PROJECT_DIR}/.go
  GOMODCACHE: ${CI_PROJECT_DIR}/.cache/go-mod
  GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
  GOPROXY: https://proxy.golang.org,direct

image: ${CI_IMAGE}

before_script:
  - export PATH="/usr/local/go/bin:${GOPATH}/bin:$PATH"
  - mkdir -p "${GOPATH}/bin" "${GOMODCACHE}" "${GOCACHE}"
  - go mod download

stages:
  - prepare
  - check
  - build
  - verify

default:
  interruptible: true
  tags:
    - docker
    - foxctl
    - k3s

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG

# --- Stage: prepare ---
# Rebuilds CI image only when infra files change. All downstream stages wait.
build-ci-image:
  stage: prepare
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script: []
  script:
    - |
      retry_cmd() {
        attempts="$1"
        sleep_seconds="$2"
        shift 2
        count=1
        while true; do
          if "$@"; then
            return 0
          fi
          if [ "$count" -ge "$attempts" ]; then
            return 1
          fi
          echo "command failed; retrying in ${sleep_seconds}s (${count}/${attempts})"
          sleep "$sleep_seconds"
          count=$((count + 1))
        done
      }
    - retry_cmd 30 2 docker info
    - retry_cmd 5 5 sh -lc 'echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"'
    - retry_cmd 3 10 docker build --pull -t ${CI_IMAGE} -f deploy/docker/Dockerfile.ci .
    - retry_cmd 3 10 docker push ${CI_IMAGE}

# --- Stage: check (all jobs run in parallel via DAG) ---
static-analysis:
  stage: check
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --no-tags origin \
          "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      fi
    - make fmt
    - git -c core.filemode=false diff --exit-code || (echo 'Formatting changed files. Run make fmt locally.' && exit 1)
    - GOGC=50 GOMEMLIMIT=1800MiB make lint GOLANGCI_TIMEOUT=30m GOLANGCI_FLAGS='--concurrency=1' LINT_TARGETS='./cmd/... ./internal/... ./plugins/... ./scripts/... ./tests/...'
    - make check-large-files
    - make check-tech-debt

unit-tests-core:
  stage: check
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make test-short-core-impacted BASE_REF="$base_ref" HEAD_REF=HEAD 2>&1 | tee test-output.txt
      else
        make test-short-core 2>&1 | tee test-output.txt
      fi
    - grep -E '(^--- |ok\s+|FAIL\s+|panic)' test-output.txt | head -100 || true

unit-tests-skills:
  stage: check
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make test-short-skills-impacted BASE_REF="$base_ref" HEAD_REF=HEAD 2>&1 | tee test-output.txt
      else
        make test-short-skills 2>&1 | tee test-output.txt
      fi
    - grep -E '(^--- |ok\s+|FAIL\s+|panic)' test-output.txt | head -100 || true

.race-tests-template:
  stage: check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$RUN_FULL_RACE == "1"'
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make test-race-shard-impacted SHARD="$RACE_SHARD" BASE_REF="$base_ref" HEAD_REF=HEAD
      else
        make test-race-shard SHARD="$RACE_SHARD"
      fi

race-core-smoke:
  stage: check
  rules:
    - if: $CI_MERGE_REQUEST_IID
  script:
    - make test-race-smoke

race-core-cmd:
  extends: .race-tests-template
  variables:
    RACE_SHARD: core-cmd

race-core-internal:
  extends: .race-tests-template
  variables:
    RACE_SHARD: core-internal

race-core-runtime:
  extends: .race-tests-template
  variables:
    RACE_SHARD: runtime

race-platform-context-tooling:
  extends: .race-tests-template
  variables:
    RACE_SHARD: context-tooling

race-platform-intelligence:
  extends: .race-tests-template
  variables:
    RACE_SHARD: intelligence

race-platform-interfaces:
  extends: .race-tests-template
  variables:
    RACE_SHARD: platform-interfaces

race-platform-storage:
  extends: .race-tests-template
  variables:
    RACE_SHARD: storage

race-platform-v2:
  extends: .race-tests-template
  variables:
    RACE_SHARD: v2

race-skills-a-g:
  extends: .race-tests-template
  variables:
    RACE_SHARD: skills-a-g

race-skills-h-o:
  extends: .race-tests-template
  variables:
    RACE_SHARD: skills-h-o

race-skills-p-x:
  extends: .race-tests-template
  variables:
    RACE_SHARD: skills-p-x

integration-tests:
  stage: check
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make test-integration-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
      else
        make test-integration
      fi

typescript-frontend:
  stage: check
  image: oven/bun:1.3.14
  before_script:
    - export PATH="/home/dev/.bun/bin:$PATH"
    - bun install --frozen-lockfile
  script:
    - bun run unused:frontend

# --- Stage: build ---
build-core:
  stage: build
  needs:
    - job: build-ci-image
  variables:
    GOFLAGS: "-buildvcs=false -p=2"
    KUBERNETES_MEMORY_REQUEST: "768Mi"
    KUBERNETES_MEMORY_LIMIT: "1536Mi"
  script:
    - make build
  artifacts:
    paths:
      - bin/foxctl
    expire_in: 7 days

build-skills:
  stage: build
  needs:
    - job: build-ci-image
  variables:
    GOFLAGS: "-buildvcs=false -p=2"
    KUBERNETES_MEMORY_REQUEST: "768Mi"
    KUBERNETES_MEMORY_LIMIT: "1536Mi"
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make skills-build-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
      else
        make skills-build
      fi

validate-manifests:
  stage: build
  needs:
    - job: build-ci-image
  script:
    - go run ./scripts/checkmanifests

all-checks:
  stage: verify
  needs:
    - job: static-analysis
    - job: unit-tests-core
    - job: unit-tests-skills
    - job: race-core-smoke
      optional: true
    - job: race-core-cmd
      optional: true
    - job: race-core-internal
      optional: true
    - job: race-core-runtime
      optional: true
    - job: race-platform-context-tooling
      optional: true
    - job: race-platform-intelligence
      optional: true
    - job: race-platform-interfaces
      optional: true
    - job: race-platform-storage
      optional: true
    - job: race-platform-v2
      optional: true
    - job: race-skills-a-g
      optional: true
    - job: race-skills-h-o
      optional: true
    - job: race-skills-p-x
      optional: true
    - job: integration-tests
    - job: build-core
    - job: build-skills
    - job: validate-manifests
  script:
    - echo "All checks passed"
