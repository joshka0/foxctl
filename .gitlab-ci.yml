    - job: race-core-smoke
      optional: true
    - job: race-core-cmd
      optional: true
    - job: race-core-internal
      optional: true
    - job: race-core-runtime
      optional: true
    - job: race-platform-context-tooling
      optional: true
    - job: race-platform-intelligence
      optional: true
    - job: race-platform-interfaces
      optional: true
    - job: race-platform-storage
      optional: true
    - job: race-platform-v2
      optional: true
    - job: race-skills-a-g
      optional: true
    - job: race-skills-h-o
      optional: true
    - job: race-skills-p-x
