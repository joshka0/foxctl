variables:
  GOFLAGS: "-buildvcs=false"
  GOTOOLCHAIN: "local"
  CI_IMAGE: ${CI_REGISTRY_IMAGE}/ci:${CI_COMMIT_SHA}
  GOPATH: ${CI_PROJECT_DIR}/.go
  GOMODCACHE: ${CI_PROJECT_DIR}/.cache/go-mod
  GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
  GOPROXY: https://proxy.golang.org,direct

image: ${CI_IMAGE}

before_script:
  - export PATH="/usr/local/go/bin:${GOPATH}/bin:$PATH"
  - mkdir -p "${GOPATH}/bin" "${GOMODCACHE}" "${GOCACHE}"
  - go mod download

stages:
  - prepare
  - check
  - build
  - verify

default:
  interruptible: true
  tags:
    - docker
    - foxctl
    - k3s

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG

.ci-image-change-paths: &ci_image_change_paths
  - .gitlab-ci.yml
  - .golangci.yml
  - deploy/docker/**/*
  - Makefile
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - plugins/**/*
  - scripts/**/*.go
  - scripts/checkmanifests/**/*
  - skills/**/*
  - tests/**/*

.go-core-change-paths: &go_core_change_paths
  - .gitlab-ci.yml
  - .golangci.yml
  - deploy/docker/**/*
  - Makefile
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - plugins/**/*
  - scripts/**/*.go
  - tests/**/*

.skill-change-paths: &skill_change_paths
  - .gitlab-ci.yml
  - deploy/docker/**/*
  - Makefile
  - go.mod
  - go.sum
  - internal/**/*
  - scripts/**/*.go
  - scripts/skill_dependency_audit/**/*
  - scripts/skills_impact/**/*
  - skills/**/*
  - tests/**/*

.go-format-change-paths: &go_format_change_paths
  - .gitlab-ci.yml
  - Makefile
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - plugins/**/*
  - scripts/**/*.go
  - skills/**/*
  - tests/**/*

.manifest-change-paths: &manifest_change_paths
  - .gitlab-ci.yml
  - deploy/docker/**/*
  - Makefile
  - internal/domain/policy/**/*
  - internal/domain/skill/**/*
  - scripts/checkmanifests/**/*
  - skills/**/skill.yaml

.race-smoke-change-paths: &race_smoke_change_paths
  - .gitlab-ci.yml
  - deploy/docker/**/*
  - Makefile
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*

.frontend-change-paths: &frontend_change_paths
  - .gitlab-ci.yml
  - Makefile
  - bun.lock
  - bunfig.toml
  - package.json
  - tsconfig.json
  - packages/data/**/*
  - packages/foxterm/**/*
  - packages/gui-agent/**/*
  - packages/gui-auth-gateway/**/*
  - scripts/**/*.ts
  - scripts/**/*.mjs
  - internal/interfaces/web/**/*

.docs-site-change-paths: &docs_site_change_paths
  - .gitlab-ci.yml
  - bun.lock
  - bunfig.toml
  - package.json
  - packages/docs-site/**/*

.docs-change-paths: &docs_change_paths
  - .gitlab-ci.yml
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - CONTRIBUTING.md
  - docs/**/*.md
  - scripts/check_doc_links.sh

.go-change-rules: &go_change_rules
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_MERGE_REQUEST_IID'
    changes: *go_core_change_paths

.skill-change-rules: &skill_change_rules
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_MERGE_REQUEST_IID'
    changes: *skill_change_paths

.go-format-change-rules: &go_format_change_rules
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_MERGE_REQUEST_IID'
    changes: *go_format_change_paths

.light-check-template:
  # Intentionally no Go toolchain. Use only for shell/Python checks and verify
  # Jobs that must still run when the per-commit CI image is skipped.
  image: python:3.13
  needs: []
  before_script: []
  variables:
    KUBERNETES_MEMORY_REQUEST: "128Mi"
    KUBERNETES_MEMORY_LIMIT: "512Mi"
    KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
    KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"

.bun-check-template:
  image: oven/bun:1.3.14
  needs: []
  before_script:
    - export PATH="/home/dev/.bun/bin:$PATH"
    - bun install --frozen-lockfile
  variables:
    KUBERNETES_MEMORY_REQUEST: "512Mi"
    KUBERNETES_MEMORY_LIMIT: "1536Mi"
    KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
    KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"

.post-fast-check-needs: &post_fast_check_needs
  - job: format-check
    optional: true
  - job: unit-tests-core
    optional: true
  - job: unit-tests-skills
    optional: true

# --- Stage: prepare ---
# Builds the per-commit CI image used by Go-backed downstream Jobs.
build-ci-image:
  stage: prepare
  image: docker:27
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_IID'
      changes: *ci_image_change_paths
  services:
    - name: docker:27-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script: []
  script:
    - |
      retry_cmd() {
        attempts="$1"
        sleep_seconds="$2"
        shift 2
        count=1
        while true; do
          if "$@"; then
            return 0
          fi
          if [ "$count" -ge "$attempts" ]; then
            return 1
          fi
          echo "command failed; retrying in ${sleep_seconds}s (${count}/${attempts})"
          sleep "$sleep_seconds"
          count=$((count + 1))
        done
      }
    - retry_cmd 30 2 docker info
    - retry_cmd 5 5 sh -lc 'echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"'
    - retry_cmd 3 10 docker build --pull -t ${CI_IMAGE} -f deploy/docker/Dockerfile.ci .
    - retry_cmd 3 10 docker push ${CI_IMAGE}

# --- Stage: check (all jobs run in parallel via DAG) ---
format-check:
  stage: check
  rules: *go_format_change_rules
  script:
    - make fmt
    - git -c core.filemode=false diff --exit-code || (echo 'Formatting changed files. Run make fmt locally.' && exit 1)

go-lint:
  stage: check
  rules: *go_change_rules
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --no-tags origin \
          "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      fi
    - GOGC=50 GOMEMLIMIT=1800MiB make lint GOLANGCI_TIMEOUT=30m GOLANGCI_FLAGS='--concurrency=1' LINT_TARGETS='./cmd/... ./internal/... ./plugins/... ./scripts/... ./tests/...'

repo-hygiene:
  extends: .light-check-template
  stage: check
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --no-tags origin \
          "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      fi
    - make repo-hygiene

docs-links:
  extends: .light-check-template
  stage: check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_IID'
      changes: *docs_change_paths
  script:
    - make check-doc-links

unit-tests-core:
  stage: check
  rules: *go_change_rules
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make test-short-core-impacted BASE_REF="$base_ref" HEAD_REF=HEAD 2>&1 | tee test-output.txt
      else
        make test-short-core 2>&1 | tee test-output.txt
      fi
    - grep -E '(^--- |ok\s+|FAIL\s+|panic)' test-output.txt | head -100 || true

unit-tests-skills:
  stage: check
  rules: *skill_change_rules
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make test-short-skills-impacted BASE_REF="$base_ref" HEAD_REF=HEAD 2>&1 | tee test-output.txt
      else
        make test-short-skills 2>&1 | tee test-output.txt
      fi
    - grep -E '(^--- |ok\s+|FAIL\s+|panic)' test-output.txt | head -100 || true

.race-tests-template:
  stage: check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$RUN_FULL_RACE == "1"'
  script:
    - |
      base_ref=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA^{commit}" >/dev/null 2>&1; then
        base_ref="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ] && git rev-parse --verify "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1; then
        base_ref="$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"
      fi
      if [ -n "$base_ref" ] && [ "$CI_COMMIT_BRANCH" != "main" ]; then
        make test-race-shard-impacted SHARD="$RACE_SHARD" BASE_REF="$base_ref" HEAD_REF=HEAD
      else
        make test-race-shard SHARD="$RACE_SHARD"
      fi

race-core-smoke:
  stage: check
  needs: *post_fast_check_needs
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$RUN_FULL_RACE == "1"'
    - if: '$CI_MERGE_REQUEST_IID'
      changes: *race_smoke_change_paths
  script:
    - make test-race-smoke

race-core-cmd:
  extends: .race-tests-template
  variables:
    RACE_SHARD: core-cmd

race-core-internal:
  extends: .race-tests-template
  variables:
    RACE_SHARD: core-internal

race-core-runtime:
