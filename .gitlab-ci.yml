variables:
  GOFLAGS: "-buildvcs=false"
  GOTOOLCHAIN: "local"
  CI_IMAGE: ${CI_REGISTRY_IMAGE}/ci:${CI_COMMIT_SHA}
  GOPATH: ${CI_PROJECT_DIR}/.go
  GOMODCACHE: ${CI_PROJECT_DIR}/.cache/go-mod
  GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
  GOPROXY: https://proxy.golang.org,direct

image: ${CI_IMAGE}

before_script:
  - export PATH="/usr/local/go/bin:${GOPATH}/bin:$PATH"
  - mkdir -p "${GOPATH}/bin" "${GOMODCACHE}" "${GOCACHE}"
  - go mod download

stages:
  - prepare
  - check
  - build

default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG

# --- Stage: prepare ---
# Rebuilds CI image only when infra files change. All downstream stages wait.
build-ci-image:
  stage: prepare
  image: docker:27
  services:
    - docker:27-dind
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    DOCKER_HOST: tcp://localhost:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script: []
  script:
    - |
      retry_cmd() {
        attempts="$1"
        sleep_seconds="$2"
        shift 2
        count=1
        while true; do
          if "$@"; then
            return 0
          fi
          if [ "$count" -ge "$attempts" ]; then
            return 1
          fi
          echo "command failed; retrying in ${sleep_seconds}s (${count}/${attempts})"
          sleep "$sleep_seconds"
          count=$((count + 1))
        done
      }
    - until docker info; do sleep 1; done
    - retry_cmd 5 5 sh -lc 'echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"'
    - retry_cmd 3 10 docker build --pull -t ${CI_IMAGE} -f Dockerfile.ci .
    - retry_cmd 3 10 docker push ${CI_IMAGE}

# --- Stage: check (all jobs run in parallel via DAG) ---
static-analysis:
  stage: check
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --no-tags origin \
          "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      fi
    - make fmt
    - git -c core.filemode=false diff --exit-code || (echo 'Formatting changed files. Run make fmt locally.' && exit 1)
    - make lint LINT_TARGETS='./cmd/... ./internal/... ./plugins/... ./scripts/... ./test/...'
    - make check-large-files
    - make check-tech-debt

unit-tests:
  stage: check
  variables:
    CGO_ENABLED: "0"
  script:
    - go test -short -v -count=1 ./... 2>&1 | tee test-output.txt
    - grep -E '(^--- |ok\s+|FAIL\s+|panic)' test-output.txt | head -100 || true

race-tests:
  stage: check
  script:
    - make test-race

cgo-build-and-tests:
  stage: check
  script:
    - make build-cgo
    - make test-cgo-short
    - CGO_ENABLED=1 AGENTCTL_V2_REQUIRE_NATIVE_VECTOR_SQL=1 go test -tags=libsqlite3 ./internal/v2/adapters/libsql/turns -run TestTurnStore_SearchArtifactsByEmbedding_VectorPathLibSQL -count=1 -v

integration-tests:
  stage: check
  script:
    - make test-integration

llm-planner-integration:
  stage: check
  variables:
    AGENTCTL_ENABLE_LIVE_LLM_TESTS: "1"
  script:
    - CGO_ENABLED=1 go test -tags=libsqlite3 ./internal/planning/llm -run TestOpenAIPlanner_Integration -timeout 120s -v
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true

# --- Stage: build ---
build:
  stage: build
  needs:
    - job: static-analysis
    - job: unit-tests
  script:
    - make build
    - make skills-build
    - go run ./scripts/checkmanifests
  artifacts:
    paths:
      - bin/agentctl
    expire_in: 7 days

all-checks:
  stage: build
  needs:
    - job: static-analysis
    - job: unit-tests
    - job: race-tests
    - job: cgo-build-and-tests
    - job: integration-tests
    - job: llm-planner-integration
  script:
    - echo "All checks passed"
