# --- Stage: build ---
build-core:
  stage: build
  rules: *go_change_rules
  variables:
    GOFLAGS: "-buildvcs=false -p=2"
    KUBERNETES_MEMORY_REQUEST: "768Mi"
    KUBERNETES_MEMORY_LIMIT: "1536Mi"
  script:
    - make build
  artifacts:
    paths:
      - bin/foxctl
    expire_in: 7 days

build-skills:
  stage: build
  rules: *skill_change_rules
  variables:
    GOFLAGS: "-buildvcs=false -p=2"
