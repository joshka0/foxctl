openapi: 3.1.0
info:
  title: agentctl API
  version: 1.0.0-draft
  description: |
    Draft HTTP API for local-only usage.
    Non-skill endpoints return a light envelope. Skill endpoints return the skill
    envelope inside data.envelope.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Local dev
    variables:
      port:
        default: "8090"
security: []  # Local-only API, no authentication required
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional API key for future authentication
  schemas:
    Envelope:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
    Meta:
      type: object
      properties:
        request_id:
          type: string
        ts:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
    AgentUpdate:
      type: object
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          description: ID of conversation to link to this agent
        name:
          type: string
          description: Human-readable name
        slug:
          type: string
          description: Human-readable handle
        exec_mode:
          type: string
          enum: [autonomous, proactive, reactive]
          description: Execution mode for the agent
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Digest:
      name: digest
      in: path
      required: true
      schema:
        type: string
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
    Dep:
      name: dep
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
  responses:
    OkEnvelope:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BinaryArtifact:
      description: CAS artifact
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    SSE:
      description: Server-sent events stream
      content:
        text/event-stream:
          schema:
            type: string
paths:
  /health:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /status:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /stats:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /insights:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /workspaces:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /workspaces/switch:
    post:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /skills:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /skills/schema:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /skills/run:
    post:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /skills/{name}:
    parameters:
      - $ref: '#/components/parameters/Name'
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /skills/{name}/run:
    parameters:
      - $ref: '#/components/parameters/Name'
    post:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /jobs:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
    post:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
    delete:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /cas:
    post:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /cas/{digest}:
    parameters:
      - $ref: '#/components/parameters/Digest'
    get:
      responses:
        '200':
          $ref: '#/components/responses/BinaryArtifact'
    head:
      responses:
        '200':
          description: Artifact exists
  /cas/{digest}/pin:
    parameters:
      - $ref: '#/components/parameters/Digest'
    post:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
    delete:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /agents:
    get:
      summary: List all agents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /agents/spawn:
    post:
      summary: Spawn a new agent via daemon
      description: Creates and starts a new agent with the specified configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - prompt
              properties:
                role:
                  type: string
                  description: Agent role (e.g., researcher, coder, planner)
                prompt:
                  type: string
                  description: Initial prompt for the agent
                workspace_id:
                  type: string
                  description: Workspace path
                skills_allow:
                  type: array
                  maxItems: 256
                  items:
                    type: string
                  description: List of allowed skills
                name:
                  type: string
                  description: Human-readable name (auto-generated if empty)
                slug:
                  type: string
                  description: Human-readable handle
                exec_mode:
                  type: string
                  enum: [autonomous, proactive, reactive, story]
                max_iterations:
                  type: integer
                max_context_tokens:
                  type: integer
                max_auto_turns:
                  type: integer
                llm_provider:
                  type: string
                llm_model:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /agents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get agent details
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
    patch:
      summary: Update agent fields (e.g., conversation_id)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
    delete:
      summary: Soft delete (trash) an agent
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /agents/{id}/daemon/start:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Start/resume a stopped agent via daemon
      description: Looks up agent config from database and spawns a new daemon session with that config. Optionally accepts a prompt and workspace override in the request body.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: Optional prompt override (uses stored prompt if not provided)
                workspace:
                  type: string
                  description: Optional workspace override (uses agent namespace if not provided)
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /agents/{id}/daemon/kill:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Stop/kill a running agent via daemon
      description: Finds the active daemon session for the agent and kills it. If no active session exists or daemon is not running, updates agent state to stopped.
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /agents/{id}/daemon/sessions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: List daemon sessions for an agent
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /sessions:
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      responses:
        '200':
          $ref: '#/components/responses/OkEnvelope'
  /sessions/{id}/messages:
