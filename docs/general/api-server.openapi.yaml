openapi: 3.1.0
info:
  title: agentctl API
  version: 1.0.0-draft
  description: |
    Draft HTTP API for local-only usage.
    Non-skill endpoints return a light envelope. Skill endpoints return the skill
    envelope inside data.envelope.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Local dev
    variables:
      port:
        default: "8090"
security: []  # Local-only API, no authentication required
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional API key for future authentication
  schemas:
    Envelope:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
    Meta:
      type: object
      properties:
        request_id:
          type: string
        ts:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Digest:
      name: digest
      in: path
      required: true
      schema:
        type: string
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
    Dep:
      name: dep
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
  responses:
    OkEnvelope:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BinaryArtifact:
      description: CAS artifact
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    SSE:
      description: Server-sent events stream
      content:
        text/event-stream:
          schema:
            type: string
paths:
