commands:
  install: go mod download
  typecheck: go vet ./...
  build: make build
  build-tui: go build -o bin/foxctl_tui ./cmd/foxctl_tui
  test: go test -race -count=1 ./internal/interfaces/tui/...
  test-all: go test -race -count=1 ./...
  test-fast: go test ./internal/interfaces/tui/... -count=1
  lint: golangci-lint run --timeout 10m ./internal/interfaces/tui/... ./cmd/foxctl_tui/...
  lint-all: golangci-lint run --timeout 10m ./...
  fmt: gofumpt -w .
  check: make check
  check-doc-links: make check-doc-links

services:
  # Per-test isolated daemon. Flow validators spawn this via the
  # per-test-daemon fixture (see internal/interfaces/tui/.../testfixture).
  #
  # DO NOT start this as a shared mission-wide service. Each flow validator
  # gets its own daemon on an OS-chosen port (`-p 0`) with a temp
  # FOXCTL_STORAGE_ROOT. The fixture handles start/stop and port parsing.
  #
  # The entry below is informational only — it documents the canonical
  # invocation the fixture uses. Workers should NOT run it directly.
  foxctl-daemon-ephemeral:
    start: "DO NOT START DIRECTLY — use per-test-daemon fixture. Canonical form: FOXCTL_STORAGE_ROOT=$(mktemp -d) bin/foxctl web serve -p 0"
    stop: "Fixture calls daemon's Shutdown via its HTTP handle and removes the temp storage root on t.Cleanup."
    healthcheck: "curl -sf http://localhost:${PORT}/healthz  # PORT parsed from daemon stderr by the fixture"
    port: 0
    depends_on: []
