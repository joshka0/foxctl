commands:
  install: go mod download
  typecheck: go vet ./...
  build: make build
  build-all: make build-all
  test: go test ./... -count=1
  test-race: go test -race ./... -count=1
  lint: golangci-lint run --timeout 10m ./...
  fmt: gofumpt -w .
  check: make check

services:
  gateway-dev:
    start: bin/agentctl gateway --dev --port 8765
    stop: lsof -ti :8765 | xargs kill 2>/dev/null || true
    healthcheck: curl -sf http://localhost:8765/healthz
    port: 8765
    depends_on: []
