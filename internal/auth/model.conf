[request_definition]
r = sub, tenant, obj, act

[policy_definition]
p = sub, tenant, obj, act, eft

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = g(r.sub, p.sub, r.tenant) && \
    (p.tenant == "*" || p.tenant == r.tenant) && \
    keyMatch(r.obj, p.obj) && \
    (p.act == "*" || p.act == r.act)
