version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
  settings:
    errcheck:
      # Don't check blank assignments - the codebase uses _ = pattern for intentional ignores
      check-blank: false
      # Exclude common cleanup patterns inline
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.Process).Kill
        - (*os.Process).Wait
        - (*os/exec.Cmd).Wait
        - os.Remove
        - os.RemoveAll
        - os.Chdir
        - (*net/http.Response).Body.Close
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
        - name: unhandled-error
          disabled: true
  exclusions:
    # Use preset for common error handling patterns (Close, Flush, Remove, print, etc.)
    presets:
      - std-error-handling
    rules:
      # Allow staticcheck style suggestions
      - linters:
          - staticcheck
        text: '(ST1023|QF1001|QF1011|omit type)'
    # Exclude generated code
    generated: strict

