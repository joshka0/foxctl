version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - depguard
    - forbidigo
    - gocyclo
  settings:
    forbidigo:
      forbid:
        # Flag stderr usage - prefer observability wide events
        - pattern: '^os\.Stderr$'
          msg: "Avoid os.Stderr for logging. Use observability.Emit() with wide events. See .claude/CLAUDE.md#logging-via-wide-events-not-stderr"
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
          msg: "Avoid log.* for logging. Use observability.Emit() with wide events. See .claude/CLAUDE.md#logging-via-wide-events-not-stderr"
        - pattern: '^zerolog\.'
          msg: "Avoid zerolog. Use observability.Emit() with wide events. See .claude/CLAUDE.md#logging-via-wide-events-not-stderr"
        # Catch zerolog by import path (handles "github.com/rs/zerolog/log" -> package "log")
        - pkg: '^github\.com/rs/zerolog'
          msg: "Avoid zerolog. Use observability.Emit() with wide events. See .claude/CLAUDE.md#logging-via-wide-events-not-stderr"
      exclude-godoc-examples: true
      analyze-types: true
    errcheck:
      # Don't check blank assignments - the codebase uses _ = pattern for intentional ignores
      check-blank: false
      # Exclude common cleanup patterns inline
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os/exec.Cmd).Run
        - (*os/exec.Cmd).Wait
        - (*os.Process).Kill
        - (*os.Process).Wait
        - os.Remove
        - os.RemoveAll
        - os.Chdir
        - (*net/http.Response).Body.Close

    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
        - name: unhandled-error
          disabled: true

    gocyclo:
      # Current max in codebase is 24 (PruneBySize). Threshold set to catch new regressions.
      min-complexity: 25

    # Enforce layered architecture - prevent layer violations
    depguard:
      rules:
        # Domain layer restrictions
        domain-no-deps:
          list-mode: lax
          files:
            - "**/internal/domain/**/*.go"
          deny:
            - pkg: "github.com/joshka0/foxctl/internal/storage"
              desc: "domain layer must not depend on storage"
            - pkg: "github.com/joshka0/foxctl/internal/runtime/execution"
              desc: "domain layer must not depend on execution"
            - pkg: "github.com/joshka0/foxctl/internal/platform"
              desc: "domain layer must not depend on platform"
            - pkg: "github.com/joshka0/foxctl/internal/adapters"
              desc: "domain layer must not depend on adapters"

        # Execution layer restrictions
        execution-limited-deps:
          list-mode: lax
          files:
            - "**/internal/runtime/execution/**/*.go"
          deny:
            - pkg: "github.com/joshka0/foxctl/internal/adapters"
              desc: "execution layer should not depend on adapters"

  exclusions:
    # Use preset for common error handling patterns (Close, Flush, Remove, print, etc.)
    presets:
      - std-error-handling
    rules:
      # Allow staticcheck style suggestions
      - linters:
          - staticcheck
        text: '(ST1023|QF1001|QF1011|QF1012|omit type)'
      # Allow zerolog in files not yet migrated to observability wide events
      # TODO: Remove these exclusions as files are migrated
      - linters:
          - forbidigo
        path: '(cmd/.*/main\.go|cmd/foxctl/cmd/.*|cmd/foxctl_viewer/.*|cmd/synctest/.*|internal/adapters/skillslib/.*|internal/runtime/actor/.*|internal/agent/.*|internal/context/companion/.*|internal/runtime/daemon/.*|internal/runtime/engine/.*|internal/interfaces/gateway/.*|internal/interfaces/tui/components/cmd/.*|internal/intelligence/analysis/.*|internal/intelligence/codemap/.*|internal/intelligence/indexing/.*|internal/platform/lsp/.*|internal/platform/.*|internal/intelligence/retrieval/.*|internal/storage/.*|internal/tooling/testwatch/.*|internal/interfaces/web/.*|plugins/.*|scripts/.*|skills/.*|.*_test\.go)'
      # Keep complexity pressure on smaller units, but don't block branch work on the
      # known command aggregators and long integration tests.
      - linters:
          - gocyclo
        path: '(cmd/.*/main\.go|cmd/foxctl/cmd/.*|cmd/foxctl_viewer/.*|internal/adapters/skillslib/.*|internal/agent/.*|internal/context/.*|internal/domain/skill/.*|internal/intelligence/.*|internal/interfaces/.*|internal/platform/.*|internal/rlm/.*|internal/runtime/.*|internal/storage/.*|internal/tooling/.*|internal/v2/adapters/.*|internal/v2/services/.*|.*_test\.go)'
    # Exclude generated code
    generated: strict
