# Smart code search command
description = "Search codebase with foxctl"

prompt = """Search the codebase for: {{args}}

```bash
!{foxctl run text/ripgrep --input '{"pattern": "{{args}}", "path": "."}'}
```

Summarize the findings:
- Group results by file/component
- Identify the most relevant matches
- Suggest next steps based on what was found"""
