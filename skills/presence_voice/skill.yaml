apiVersion: agentctl/v1
kind: Skill
metadata:
  name: presence/voice
  version: 0.1.0
  description: "Generate speech audio using ElevenLabs or Pocket TTS with optional rewrite"
  tags: ["presence", "voice", "tts", "elevenlabs", "pocket-tts", "companion"]
distribution:
  type: exec
  exec:
    entry: bin
io:
  format: JSON
  inline_output_kb: 4
signature:
  command: presence/voice
  parameters:
    - name: text
      type: string
      required: true
      description: "Text to synthesize (max 5000 chars). Supports *markers* for emotion."
    - name: voice_id
      type: string
      required: false
      description: "Voice selector (ElevenLabs voice ID or Pocket voice alias/url)"
    - name: emotion
      type: string
      required: false
      description: "Emotion to apply: neutral|joy|sadness|anger|fear|surprise|playful"
    - name: intensity
      type: number
      required: false
      default: 0.5
      description: "Emotion intensity 0.0-1.0 for voice modulation"
    - name: conversation_id
      type: string
      required: false
      description: "Conversation ID for caching context"
    - name: use_cache
      type: boolean
      required: false
      default: true
      description: "Check cache before generating new audio"
    - name: model
      type: string
      required: false
      default: "eleven_multilingual_v2"
      description: "TTS model (ElevenLabs only; ignored for Pocket)"
    - name: provider
      type: string
      required: false
      default: "elevenlabs"
      description: "TTS provider: elevenlabs|pocket"
    - name: pocket_base_url
      type: string
      required: false
      default: "http://127.0.0.1:18765"
      description: "Pocket TTS server base URL"
    - name: rewrite_for_tts
      type: boolean
      required: false
      default: false
      description: "Rewrite text for speech-friendly conversational output before synthesis"
    - name: rewrite_model
      type: string
      required: false
      default: "minimax/minimax-m2-her"
      description: "OpenRouter model used for rewrite_for_tts"
    - name: rewrite_max_chars
      type: integer
      required: false
      default: 280
      description: "Maximum character length for rewritten speech text"
    - name: rewrite_prompt
      type: string
      required: false
      description: "Extra prompt guidance passed to minimax-m2-her for TTS style"
    - name: rewrite_base_url
      type: string
      required: false
      default: "https://openrouter.ai/api/v1"
      description: "OpenAI-compatible base URL for rewrite model (e.g. LM Studio: http://127.0.0.1:1234/v1)"
  help:
    short: "Generate emotion-aware speech with ElevenLabs or Pocket TTS"
    long: |
      Generate speech audio with emotion-aware delivery.

      Providers:
      - elevenlabs: cloud TTS with rich voice settings
      - pocket: local Pocket TTS server (`pocket-tts serve`)

      Voice settings adjust based on emotion:
      - neutral: Balanced stability and similarity
      - joy: Lower stability, higher style for expressiveness
      - sadness: Higher stability, lower similarity for softer tone
      - anger: Low stability, high similarity for intensity
      - playful: Low stability, high style for fun delivery

      Text can include *markers* like *sighs*, *laughs* which influence delivery.
      Generated audio is stored in CAS and cached by text hash.

      Example:
        agentctl run presence/voice --input '{
          "text": "*softly* I understand how you feel...",
          "emotion": "sadness",
          "intensity": 0.7
        }'

    workflows:
      - id: synthesize-text
        description: "Generate speech for text"
        example_input:
          text: "Hello! How are you today?"
          emotion: "joy"
      - id: emotional-delivery
        description: "Synthesize with specific emotion"
        example_input:
          text: "*sighs* I see what you mean..."
          emotion: "sadness"
          intensity: 0.8
  returns:
    - name: audio_digest
      type: string
      description: "CAS digest of generated audio (sha256:...)"
    - name: duration_ms
      type: integer
      description: "Audio duration in milliseconds"
    - name: cached
      type: boolean
      description: "Whether the result was served from cache"
    - name: model
      type: string
      description: "Model used for synthesis"
    - name: voice_id
      type: string
      description: "Voice ID used"
    - name: provider
      type: string
      description: "Provider used for synthesis"
    - name: rewrite_applied
      type: boolean
      description: "Whether rewrite_for_tts was applied successfully"
    - name: rewrite_model
      type: string
      description: "Model used for rewrite_for_tts when applied"
    - name: rewrite_error
      type: string
      description: "Rewrite error when rewrite_for_tts failed and original text was used"
capabilities:
  network: "egress"
  filesystem: []
  pure: false
