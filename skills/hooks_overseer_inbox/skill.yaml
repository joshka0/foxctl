apiVersion: foxctl/v1
kind: Skill
metadata:
  name: hooks/overseer_inbox
  version: 0.1.0
  description: "Claude Code hook that surfaces mailbox messages to overseer for human-in-the-loop coordination"
  tags: ["hook", "mailbox", "overseer", "human-in-the-loop", "pre-tool-use"]
distribution:
  type: exec
  exec:
    entry: skills/hooks_overseer_inbox/overseer_inbox
io:
  format: JSON
  inline_output_kb: 16
signature:
  command: hooks/overseer_inbox
  parameters:
    - name: event
      type: string
      required: true
      description: "Hook event type (e.g., PreToolUse)"
    - name: workspace_root
      type: string
      required: false
      description: "Absolute path to workspace root"
    - name: workspace_id
      type: string
      required: false
      description: "Stable workspace ID (optional)"
    - name: session_id
      type: string
      required: false
      description: "Claude session identifier"
    - name: actor_id
      type: string
      required: false
      description: "Actor identifier"
    - name: tool_name
      type: string
      required: false
      description: "Name of the tool being used"
    - name: tool_canonical
      type: string
      required: false
      description: "Canonical tool name (edit.apply_patch, fs.read_file, etc.)"
    - name: tool_kind
      type: string
      required: false
      description: "Tool category: read, write, exec, search, any"
    - name: tool_input
      type: object
      required: false
      description: "Raw JSON input to the tool"
  help:
    short: "Surface overseer inbox messages in hooks."
    long: |
      Use hooks/overseer_inbox to fetch mailbox messages before tool use.
      Example commands:
        foxctl run hooks/overseer_inbox --input '{"event":"PreToolUse","workspace_root":"/workspace/project","tool_name":"Edit"}'
        foxctl skills run hooks/overseer_inbox --event PreToolUse --workspace_root /workspace/project --tool_name Edit
    workflows:
      - id: check-inbox
        description: "Check for overseer messages."
        example_input:
          event: "PreToolUse"
          workspace_root: "/workspace/project"
          tool_name: "Edit"
  returns:
    - name: hook_output
      type: object
      description: "Hook output with decision, context containing messages, and metadata"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
env:
  - name: FOXCTL_OVERSEER_RECIPIENT
    description: "Recipient to monitor for messages (default: 'overseer', use '*' for broadcast)"
    default: "overseer"
  - name: FOXCTL_OVERSEER_AUTOACK
    description: "Set to '0' to disable auto-ack of displayed messages (default: '1')"
    default: "1"
