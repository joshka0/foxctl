apiVersion: foxctl/v1
kind: Skill
metadata:
  name: arxiv/summarize
  version: 0.1.0
  description: "Fetch an arXiv PDF and summarize it with OpenRouter Gemini, including visual interpretation and no citations"
  tags: ["arxiv", "papers", "pdf", "openrouter", "gemini", "summarize"]
distribution:
  type: exec
  exec:
    entry: skills/arxiv_summarize/arxiv_summarize
io:
  format: JSON
  inline_output_kb: 128
signature:
  command: arxiv/summarize
  parameters:
    - name: paper
      type: string
      required: true
      description: "arXiv ID, arXiv URL, PDF URL, or local PDF path"
    - name: model
      type: string
      required: false
      default: "google/gemini-3.1-flash-lite-preview"
      description: "OpenRouter model to use"
    - name: endpoint
      type: string
      required: false
      default: "https://openrouter.ai/api/v1/chat/completions"
      description: "OpenAI-compatible chat completions endpoint"
    - name: api_key
      type: string
      required: false
      description: "Optional API key override; otherwise OPENROUTER_API_KEY or foxctl config is used"
    - name: engine
      type: string
      required: false
      enum: ["native", "mistral-ocr", "pdf-text"]
      default: "native"
      description: "OpenRouter PDF parser engine; native is preferred for visual interpretation"
    - name: prompt
      type: string
      required: false
      description: "Optional replacement prompt"
    - name: timeout_sec
      type: integer
      required: false
      default: 180
      description: "HTTP request timeout in seconds"
    - name: max_tokens
      type: integer
      required: false
      default: 12000
      description: "Maximum output tokens for the model"
    - name: temperature
      type: number
      required: false
      default: 0.1
      description: "Sampling temperature"
    - name: max_pdf_bytes
      type: integer
      required: false
      default: 83886080
      description: "Maximum PDF bytes to download or read"
  returns:
    - name: outline
      type: string
      description: "Citation-free paper outline"
    - name: source
      type: string
      description: "Resolved PDF source"
    - name: model
      type: string
    - name: engine
      type: string
    - name: usage
      type: object
      description: "Provider token usage when returned"
  help:
    short: "Summarize an arXiv PDF with OpenRouter Gemini."
    long: |
      Fetches an arXiv paper PDF, sends it to OpenRouter as a PDF file input,
      and returns a full outline. The default prompt asks Gemini to interpret
      figures, tables, diagrams, screenshots, plots, equations, captions, and
      appendices, while omitting citations and bibliography entries.

      Examples:
        foxctl run arxiv/summarize --input '{"paper":"2401.12345"}'
        foxctl run arxiv/summarize --input '{"paper":"https://arxiv.org/abs/2401.12345"}'
        foxctl run arxiv/summarize --input '{"paper":"./paper.pdf","engine":"native"}'
capabilities:
  network: "egress"
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
