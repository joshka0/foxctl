apiVersion: agentctl/v1
kind: Skill
metadata:
  name: graph/pagerank
  version: 0.1.0
  description: "Compute PageRank scores for all nodes in the dependency graph"
  tags: ["graph", "pagerank", "ranking"]
distribution:
  type: exec
  exec:
    entry: graph_pagerank
  network: none
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: graph/pagerank
  parameters:
    - name: workspace
      type: string
      required: false
      description: "Workspace path (defaults to runner workspace)"
    - name: damping_factor
      type: number
      required: false
      description: "PageRank damping factor (default 0.85)"
    - name: tolerance
      type: number
      required: false
      description: "Convergence tolerance (default 1e-6)"
  help:
    short: "Compute PageRank scores for the dependency graph."
    long: |
      Use graph/pagerank to recompute PageRank scores for graph nodes.
      Example commands:
        agentctl run graph/pagerank --input '{"workspace":"./","damping_factor":0.85}'
        agentctl skills run graph/pagerank --workspace ./ --damping_factor 0.85
    workflows:
      - id: recompute
        description: "Recompute PageRank for the current workspace."
        example_input:
          workspace: "./"
          damping_factor: 0.85
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
