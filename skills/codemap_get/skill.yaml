apiVersion: agentctl/v1
kind: Skill
metadata:
  name: codemap/get
  version: 0.1.0
  description: "Retrieve a single codemap by ID with full content (traces, files, description)"
  tags: ["codemap", "get", "memory"]
distribution:
  type: exec
  exec:
    entry: bin
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: codemap/get
  parameters:
    - name: id
      type: string
      required: true
      description: "Codemap ID/name to retrieve (e.g., 'codemap://my-codemap' or 'my-codemap')"
    - name: workspace
      type: string
      required: false
      description: "Workspace path (defaults to current directory)"
    - name: include_traces
      type: boolean
      required: false
      default: true
      description: "Include full trace details in output"
    - name: max_trace_content
      type: integer
      required: false
      default: 500
      description: "Maximum characters per trace content (truncate longer)"
  help:
    short: "Retrieve a codemap by ID."
    long: |
      Use codemap/get to fetch a codemap and its traces.
      Example commands:
        agentctl run codemap/get --input '{"id":"codemap://auth-flow"}'
        agentctl skills run codemap/get --id codemap://auth-flow
        agentctl run codemap/get --input '{"id":"auth-flow","include_traces":false}'
        agentctl skills run codemap/get --id auth-flow --include_traces=false
    workflows:
      - id: get-codemap
        description: "Get a codemap by ID."
        example_input:
          id: "codemap://auth-flow"
      - id: get-summary
        description: "Fetch codemap without traces."
        example_input:
          id: "auth-flow"
          include_traces: false
returns:
  - name: codemap
    type: object
    description: "Full codemap content with title, description, files, and traces"
  - name: found
    type: boolean
    description: "Whether the codemap was found"
  - name: stats
    type: object
    description: "Query statistics"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
