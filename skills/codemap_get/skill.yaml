apiVersion: foxctl/v1
kind: Skill
metadata:
  name: codemap/get
  version: 0.2.0
  description: "Retrieve a single codemap by ID with full content (traces, files, description)"
  tags: ["codemap", "get", "memory"]
distribution:
  type: exec
  exec:
    entry: bin
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: codemap/get
  parameters:
    - name: id
      type: string
      required: true
      description: "Codemap ID/name to retrieve (e.g., 'codemap://my-codemap' or 'my-codemap')"
    - name: workspace
      type: string
      required: false
      description: "Workspace path (defaults to current directory)"
    - name: include_traces
      type: boolean
      required: false
      default: true
      description: "Include full trace details in output"
    - name: max_trace_content
      type: integer
      required: false
      default: 500
      description: "Maximum characters per trace content (truncate longer)"
    - name: inline_mode
      type: string
      required: false
      default: auto
      enum: ["auto", "full", "preview", "artifact_only"]
      description: "How much trace detail to inline; auto prefers preview + artifact for larger codemaps"
  help:
    short: "Retrieve a codemap by ID."
    long: |
      Use codemap/get to fetch a codemap and its traces.
      Example commands:
        foxctl run codemap/get --input '{"id":"codemap://auth-flow"}'
        foxctl skills run codemap/get --id codemap://auth-flow
        foxctl run codemap/get --input '{"id":"auth-flow","include_traces":false}'
        foxctl skills run codemap/get --id auth-flow --include_traces=false
    workflows:
      - id: get-codemap
        description: "Get a codemap by ID."
        example_input:
          id: "codemap://auth-flow"
      - id: get-summary
        description: "Fetch codemap without traces."
        example_input:
          id: "auth-flow"
          include_traces: false
returns:
  - name: codemap
    type: object
    description: "Full codemap content with title, description, files, and traces"
  - name: found
    type: boolean
    description: "Whether the codemap was found"
  - name: inline_mode
    type: string
    description: "Resolved inline mode used for the response"
  - name: traces_total
    type: integer
    description: "Total traces before preview truncation"
  - name: traces_truncated
    type: boolean
    description: "Whether inline traces were preview-truncated"
  - name: artifact
    type: string
    description: "CAS artifact digest for the full untruncated codemap when previewed inline"
  - name: stats
    type: object
    description: "Query statistics"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
