apiVersion: foxctl/v1
kind: Skill
metadata:
  name: fs/ls
  version: 0.1.0
  description: "List directory entries"
  tags: ["fs", "ls", "files"]
distribution:
  type: exec
  exec:
    entry: skills/fs_ls/fs_ls
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: fs/ls
  parameters:
    - name: path
      type: string
      required: false
      description: "Directory to list (default .)"
    - name: include
      type: array
      required: false
      items:
        type: string
    - name: exclude
      type: array
      required: false
      items:
        type: string
    - name: max_entries
      type: integer
      required: false
      default: 200
    - name: show_hidden
      type: boolean
      required: false
      default: false
  help:
    short: "List directory entries with include/exclude filtering."
    long: |
      Use fs/ls to list workspace directories with optional glob filters.
      Example commands:
        foxctl run fs/ls --input '{"path":"./src"}'
        foxctl skills run fs/ls --path ./src
        foxctl run fs/ls --input '{"path":".","include":["*.go"],"show_hidden":false}'
        foxctl skills run fs/ls --path . --include '*.go' --show_hidden=false
    workflows:
      - id: list-basic
        description: "List entries in the src directory."
        example_input:
          path: "./src"
      - id: list-filtered
        description: "List Go files in the current directory."
        example_input:
          path: "."
          include:
            - "*.go"
returns:
  - name: entries
    type: array
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
