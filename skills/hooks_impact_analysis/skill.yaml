apiVersion: foxctl/v1
kind: Skill
metadata:
  name: hooks/impact_analysis
  version: 0.1.0
  description: "LSP-based impact analysis - find external dependencies of edited symbols"
  tags: ["hooks", "lsp", "impact", "references"]
distribution:
  type: exec
  exec:
    entry: skills/hooks_impact_analysis/hooks_impact_analysis
io:
  format: JSON
  inline_output_kb: 16
signature:
  command: hooks/impact_analysis
  parameters:
    - name: tool_name
      type: string
      required: false
      description: "Tool name from hook (Edit, Write, etc.)"
    - name: tool_canonical
      type: string
      required: false
      description: "Canonical tool name (edit.apply_patch, fs.write_file, etc.)"
    - name: tool_kind
      type: string
      required: false
      description: "Tool category: read, write, exec, search, any"
    - name: tool_input
      type: object
      required: false
      description: "Tool input containing file_path"
    - name: tool_observation
      type: object
      required: false
      description: "Tool observation from hook"
    - name: workspace_root
      type: string
      required: false
      description: "Workspace root (optional)"
    - name: workspace_id
      type: string
      required: false
      description: "Stable workspace ID (optional)"
  help:
    short: "Analyze impact of edits via LSP."
    long: |
      Use hooks/impact_analysis to emit impact context from tool usage.
      Example commands:
        foxctl run hooks/impact_analysis --input '{"tool_name":"Edit","tool_input":{"file_path":"main.go"}}'
        foxctl skills run hooks/impact_analysis --tool_name Edit --tool_input '{"file_path":"main.go"}'
    workflows:
      - id: impact-edit
        description: "Analyze an edit to main.go."
        example_input:
          tool_name: "Edit"
          tool_input:
            file_path: "main.go"
  returns:
    - name: hook_output
      type: object
      description: "Hook output with decision and context"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
