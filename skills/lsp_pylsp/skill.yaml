apiVersion: agentctl/v1
kind: Skill
metadata:
  name: lsp/pylsp
  version: 0.1.0
  description: "Python language server operations via python-lsp-server (pylsp)"
  tags: ["lsp", "python", "pylsp", "navigation", "references"]
distribution:
  type: exec
  exec:
    entry: skills/lsp_pylsp/lsp_pylsp
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: lsp/pylsp
  parameters:
    - name: operation
      type: string
      required: true
      enum: ["definition", "references", "symbols", "workspace_symbol", "hover", "diagnostics"]
      description: "LSP operation to perform"
    - name: file
      type: string
      required: false
      description: "File path (required for most operations)"
    - name: line
      type: integer
      required: false
      description: "Line number (1-based, for position-based operations)"
    - name: column
      type: integer
      required: false
      description: "Column number (1-based, for position-based operations)"
    - name: query
      type: string
      required: false
      description: "Search query (for workspace_symbol operation)"
    - name: max_results
      type: integer
      required: false
      default: 50
      description: "Maximum number of results to return"
  help:
    short: "Query Python symbols and references."
    long: |
      Use lsp/pylsp to query Python language server operations.
      Example commands:
        agentctl run lsp/pylsp --input '{"operation":"definition","file":"app.py","line":12,"column":4}'
        agentctl skills run lsp/pylsp --operation definition --file app.py --line 12 --column 4
        agentctl run lsp/pylsp --input '{"operation":"workspace_symbol","query":"Client"}'
        agentctl skills run lsp/pylsp --operation workspace_symbol --query Client
    workflows:
      - id: find-definition
        description: "Find a definition in a file."
        example_input:
          operation: "definition"
          file: "app.py"
          line: 12
          column: 4
      - id: search-symbols
        description: "Search workspace symbols."
        example_input:
          operation: "workspace_symbol"
          query: "Client"
returns:
  - name: results
    type: array
    description: "LSP operation results"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
  cacheable: false
openapi:
  enabled: true
  methods:
    GET: definition
    POST: "true"
