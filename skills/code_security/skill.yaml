apiVersion: foxctl/v1
kind: Skill
metadata:
  name: code/security
  version: 0.1.0
  description: "Security vulnerability detection: injection, XSS, secrets, weak crypto, unsafe patterns"
  tags: ["security", "vulnerability", "code", "scanning"]
distribution:
  type: exec
  exec:
    entry: skills/code_security/code_security
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: code/security
  parameters:
    - name: path
      type: string
      required: false
      description: "File or directory to scan (default .)"
    - name: scan_mode
      type: string
      required: false
      enum: ["scan", "secrets", "injection", "crypto"]
      default: "scan"
      description: "Scan mode"
    - name: severity_threshold
      type: string
      required: false
      enum: ["low", "medium", "high", "critical"]
      default: "low"
      description: "Minimum severity to report"
    - name: categories
      type: array
      required: false
      items:
        type: string
      description: "Vulnerability categories to check"
    - name: exclude_tests
      type: boolean
      required: false
      default: true
      description: "Exclude test files"
    - name: max_results
      type: integer
      required: false
      default: 100
      description: "Maximum number of results"
  help:
    short: "Scan code for common security issues."
    long: |
      Use code/security to scan for secrets, injection risks, and unsafe crypto.
      Example commands:
        foxctl run code/security --input '{"path":"./src","scan_mode":"scan","severity_threshold":"medium"}'
        foxctl skills run code/security --path ./src --scan_mode scan --severity_threshold medium
        foxctl run code/security --input '{"path":"./src","scan_mode":"secrets"}'
        foxctl skills run code/security --path ./src --scan_mode secrets
    workflows:
      - id: scan-all
        description: "Scan for security issues."
        example_input:
          path: "./src"
          scan_mode: "scan"
          severity_threshold: "medium"
      - id: scan-secrets
        description: "Scan for secrets only."
        example_input:
          path: "./src"
          scan_mode: "secrets"
returns:
  - name: vulnerabilities
    type: array
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
