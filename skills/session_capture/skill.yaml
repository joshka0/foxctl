apiVersion: agentctl/v1
kind: Skill
metadata:
  name: session/capture
  version: 0.1.0
  description: "Capture and extract high-signal content from Claude Code and Codex conversation sessions"
  tags: ["session", "memory", "claude-code", "codex", "conversation"]
distribution:
  type: exec
  exec:
    entry: skills/session_capture/session_capture
io:
  format: JSON
  inline_output_kb: 16
signature:
  command: session/capture
  parameters:
    - name: workspace
      type: string
      required: false
      description: "Project workspace path (defaults to cwd)"
    - name: session_id
      type: string
      required: false
      description: "Specific session ID to capture (optional, captures most recent if omitted)"
    - name: source
      type: string
      required: false
      description: "Session source: claude (default) or codex"
    - name: claude_home
      type: string
      required: false
      description: "Path to Claude Code home directory (defaults to ~/.claude)"
    - name: codex_home
      type: string
      required: false
      description: "Path to Codex home directory (defaults to ~/.codex)"
    - name: scan
      type: boolean
      required: false
      description: "For source=codex, scan all Codex sessions and capture those matching the workspace"
    - name: scan_limit
      type: integer
      required: false
      description: "Maximum number of Codex session files to scan"
    - name: summarize
      type: boolean
      required: false
      description: "Run summarization after capture (requires Cerebras API key)"
    - name: force
      type: boolean
      required: false
      description: "Re-capture even if session already exists"
  help:
    short: "Capture a Claude Code session into the store."
    long: |
      Use session/capture to ingest the latest or a specific session.
      Example commands:
        agentctl run session/capture --input '{"workspace":"./","summarize":true}'
        agentctl skills run session/capture --workspace ./ --summarize
        agentctl run session/capture --input '{"session_id":"abc123","force":true}'
        agentctl skills run session/capture --session_id abc123 --force
    workflows:
      - id: capture-latest
        description: "Capture the most recent session."
        example_input:
          workspace: "./"
          summarize: true
      - id: capture-specific
        description: "Capture a specific session ID."
        example_input:
          session_id: "abc123"
          force: true
      - id: capture-codex-scan
        description: "Scan Codex sessions for this workspace."
        example_input:
          source: "codex"
          scan: true
          workspace: "./"
returns:
  - name: session_id
    type: string
    description: "Captured session ID"
  - name: workspace_path
    type: string
    description: "Associated workspace path"
  - name: message_count
    type: integer
    description: "Number of messages in the session"
  - name: user_turns
    type: integer
    description: "Number of user messages"
  - name: tool_invocations
    type: integer
    description: "Number of tool calls"
  - name: status
    type: string
    description: "Capture status: captured, exists, error"
  - name: sessions_scanned
    type: integer
    description: "Number of Codex session files scanned (scan mode)"
  - name: sessions_matched
    type: integer
    description: "Number of Codex sessions matched to workspace (scan mode)"
  - name: sessions_captured
    type: integer
    description: "Number of Codex sessions captured (scan mode)"
  - name: sessions_skipped
    type: integer
    description: "Number of Codex sessions skipped (scan mode)"
  - name: message
    type: string
    description: "Human-readable summary"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
