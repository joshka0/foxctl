apiVersion: foxctl/v1
kind: Skill
metadata:
  name: jira/board
  version: 0.1.0
  description: "Navigate Jira boards, board issues, sprints, backlog, and board placement using stable Jira Cloud API token auth"
  tags: ["jira", "board", "agile", "sprint"]
distribution:
  type: exec
  exec:
    entry: skills/jira_board/jira_board
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: jira/board
  parameters:
    - name: operation
      type: string
      required: false
      description: "Operation: list, issues, sprints, backlog, current, move_to_sprint, move_to_backlog"
      enum: ["list", "issues", "sprints", "backlog", "current", "move_to_sprint", "move_to_backlog"]
      default: "list"
    - name: list
      type: object
      required: false
      description: "Options for listing boards"
      properties:
        start_at:
          type: integer
          description: "Pagination offset"
        max_results:
          type: integer
          description: "Max boards to return (default: 50)"
        project_key_or_id:
          type: string
          description: "Filter boards for a Jira project key or id"
        name:
          type: string
          description: "Filter by board name"
        type:
          type: string
          description: "Board type filter, for example scrum or kanban"
    - name: issues
      type: object
      required: false
      description: "Options for listing issues on one board"
      properties:
        board_id:
          type: integer
          description: "Board id"
        jql:
          type: string
          description: "Additional JQL filter scoped within the board"
        fields:
          type: array
          items:
            type: string
          description: "Issue fields to return"
        start_at:
          type: integer
          description: "Pagination offset"
        max_results:
          type: integer
          description: "Max issues to return (default: 50)"
    - name: sprints
      type: object
      required: false
      description: "Options for listing sprints on one board"
      properties:
        board_id:
          type: integer
          description: "Board id"
        state:
          type: string
          description: "Sprint state filter, for example active, future, closed"
        start_at:
          type: integer
          description: "Pagination offset"
        max_results:
          type: integer
          description: "Max sprints to return (default: 50)"
    - name: backlog
      type: object
      required: false
      description: "Options for listing backlog issues on one board"
      properties:
        board_id:
          type: integer
          description: "Board id"
        jql:
          type: string
          description: "Additional JQL filter scoped within the backlog"
        fields:
          type: array
          items:
            type: string
          description: "Issue fields to return"
        start_at:
          type: integer
          description: "Pagination offset"
        max_results:
          type: integer
          description: "Max issues to return (default: 50)"
    - name: current
      type: object
      required: false
      description: "Options for listing issues in the active sprint for one board"
      properties:
        board_id:
          type: integer
          description: "Board id"
        jql:
          type: string
          description: "Additional JQL filter scoped within the active sprint"
        fields:
          type: array
          items:
            type: string
          description: "Issue fields to return"
        start_at:
          type: integer
          description: "Pagination offset"
        max_results:
          type: integer
          description: "Max issues to return (default: 50)"
    - name: move_to_sprint
      type: object
      required: false
      description: "Move issues into a sprint"
      properties:
        sprint_id:
          type: integer
          description: "Sprint id"
        issues:
          type: array
          items:
            type: string
          description: "Issue keys to move"
    - name: move_to_backlog
      type: object
      required: false
      description: "Move issues back into backlog"
      properties:
        issues:
          type: array
          items:
            type: string
          description: "Issue keys to move"
  help:
    short: "Navigate Jira boards and sprints."
    long: |
      Use jira/board to explore Jira boards, inspect current sprint and backlog
      issues, and move issues between sprint and backlog without relying on
      interactive OAuth flows.

      Authentication is read from:
        JIRA_BASE_URL
        JIRA_EMAIL
        JIRA_API_TOKEN

      Example commands:
        foxctl run jira/board --input '{"operation":"list"}'
        foxctl run jira/board --input '{"operation":"issues","issues":{"board_id":12,"fields":["summary","status","assignee"]}}'
        foxctl run jira/board --input '{"operation":"sprints","sprints":{"board_id":12,"state":"active,future"}}'
        foxctl run jira/board --input '{"operation":"current","current":{"board_id":12,"fields":["summary","status"]}}'
        foxctl run jira/board --input '{"operation":"move_to_backlog","move_to_backlog":{"issues":["ENG-123"]}}'
    workflows:
      - id: list-boards
        description: "List Jira boards."
        example_input:
          operation: "list"
      - id: board-issues
        description: "List issues for a specific board."
        example_input:
          operation: "issues"
          issues:
            board_id: 12
            fields: ["summary", "status", "assignee"]
      - id: board-sprints
        description: "List sprints for a specific board."
        example_input:
          operation: "sprints"
          sprints:
            board_id: 12
            state: "active,future"
      - id: current-sprint
        description: "List the active sprint issues for a specific board."
        example_input:
          operation: "current"
          current:
            board_id: 12
            fields: ["summary", "status"]
      - id: backlog
        description: "List backlog issues for a specific board."
        example_input:
          operation: "backlog"
          backlog:
            board_id: 12
            fields: ["summary", "status"]
      - id: move-to-sprint
        description: "Move issues into a sprint."
        example_input:
          operation: "move_to_sprint"
          move_to_sprint:
            sprint_id: 6484
            issues: ["ENG-123"]
returns:
  - name: values
    type: array
    description: "Boards or sprints returned by Jira"
  - name: issues
    type: array
    description: "Issues returned by Jira"
capabilities:
  network: "egress"
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: list
    POST: issues
