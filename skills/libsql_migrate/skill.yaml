apiVersion: agentctl/v1
kind: Skill
metadata:
  name: libsql/migrate
  description: Migrate SQLite databases to self-hosted libsql with vector support
  version: 0.1.0
  author: agentctl
  tags: [libsql, migration, vector, sqlite]
distribution:
  type: exec
  exec:
    entry: skills/libsql_migrate/libsql_migrate
    cgo: true
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: libsql/migrate
  parameters:
    - name: libsql_url
      type: string
      required: true
      description: "libsql server URL (e.g., http://100.x.x.x:8080)"
    - name: auth_token
      type: string
      required: false
      description: Auth token for libsql server
    - name: scope
      type: string
      required: false
      default: "all"
      description: "What to migrate: all, memories, sessions"
    - name: source_dir
      type: string
      required: false
      description: Source SQLite storage directory (defaults to ~/.agentctl/storage)
    - name: batch_size
      type: integer
      required: false
      default: 100
      description: Records to migrate per batch
    - name: dry_run
      type: boolean
      required: false
      default: false
      description: Show what would be migrated without writing
    - name: vector_dims
      type: integer
      required: false
      default: 1024
      description: Embedding dimensions (1024 for Voyage, 3072 for Gemini)
  returns:
    - name: scope
      type: string
      description: Migration scope
    - name: memories_migrated
      type: integer
      description: Number of memories migrated
    - name: sessions_migrated
      type: integer
      description: Number of sessions migrated
    - name: memory_types
      type: array
      description: Breakdown of named_memory records by type and embedding presence
    - name: errors
      type: integer
      description: Number of errors encountered
    - name: duration_ms
      type: integer
      description: Migration duration in milliseconds
    - name: tables
      type: array
      description: Per-table migration statistics
    - name: error_details
      type: array
      description: Details of errors encountered
  help:
    short: "Migrate SQLite to self-hosted libsql"
    long: |
      Migrates agentctl's SQLite databases (memories, sessions) to a self-hosted
      libsql server with vector search support.

      Prerequisites:
      1. Start sqld server: docker run -p 8080:8080 ghcr.io/tursodatabase/libsql-server
      2. Run migration: agentctl run libsql/migrate --input '{"libsql_url": "http://localhost:8080"}'

      The skill preserves all embeddings and creates F32_BLOB vector columns
      for native libsql vector search.
    workflows:
      - id: dry-run
        description: "Preview migration"
        example_input:
          libsql_url: "http://localhost:8080"
          dry_run: true
      - id: migrate-all
        description: "Migrate everything"
        example_input:
          libsql_url: "http://localhost:8080"
          scope: "all"
      - id: migrate-memories
        description: "Migrate only memories"
        example_input:
          libsql_url: "http://localhost:8080"
          scope: "memories"
capabilities:
  network: "egress"
  filesystem:
    - type: home
  pure: false
memory:
  recommend: false
