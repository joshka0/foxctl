apiVersion: foxctl/v1
kind: Skill
metadata:
  name: skill/inspect
  version: 0.1.0
  description: "Inspect skill implementation details for LLM analysis and troubleshooting"
  tags: ["skill", "inspect", "meta", "debug"]
distribution:
  type: exec
  exec:
    entry: skills/skill_inspect/skill_inspect
io:
  format: JSON
  inline_output_kb: 128
signature:
  command: skill/inspect
  parameters:
    - name: skill_name
      type: string
      required: true
      description: "Skill name to inspect (e.g., 'fs/ls', 'git/worktree')"
    - name: view
      type: string
      required: false
      description: "What to show: manifest, types, api, implementation, full, examples"
      enum: ["manifest", "types", "api", "implementation", "full", "examples", "all"]
      default: "api"
    - name: function
      type: string
      required: false
      description: "Specific function name to show (for implementation view)"
  help:
    short: "Inspect skill manifests, APIs, and examples."
    long: |
      Use skill/inspect to retrieve manifest details or generated examples for a skill.
      Example commands:
        foxctl run skill/inspect --input '{"skill_name":"fs/ls","view":"api"}'
        foxctl skills run skill/inspect --skill-name fs/ls --view api
        foxctl run skill/inspect --input '{"skill_name":"todo/manage","view":"examples"}'
        foxctl skills run skill/inspect --skill-name todo/manage --view examples
    workflows:
      - id: inspect-api
        description: "Inspect a skill API."
        example_input:
          skill_name: "fs/ls"
          view: "api"
      - id: inspect-examples
        description: "Inspect examples for a skill."
        example_input:
          skill_name: "todo/manage"
          view: "examples"
returns:
  - name: inspection
    type: object
    description: "Skill inspection results"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
