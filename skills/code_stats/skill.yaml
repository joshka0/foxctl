apiVersion: agentctl/v1
kind: Skill
metadata:
  name: code/stats
  version: 0.1.0
  description: "Codebase statistics: file counts, language detection, lines of code, directory analysis"
  tags: ["code", "statistics", "analysis", "language"]
distribution:
  type: exec
  exec:
    entry: skills/code_stats/code_stats
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: code/stats
  parameters:
    - name: path
      type: string
      required: false
      description: "Directory to analyze (default .)"
    - name: breakdown_by
      type: string
      required: false
      enum: ["language", "directory", "extension"]
      default: "language"
      description: "How to break down statistics"
    - name: include_tests
      type: boolean
      required: false
      default: true
      description: "Include test files in statistics"
    - name: max_depth
      type: integer
      required: false
      default: 0
      description: "Maximum directory depth (0 = unlimited)"
  help:
    short: "Summarize codebase statistics."
    long: |
      Use code/stats to get file counts and language breakdowns.
      Example commands:
        agentctl run code/stats --input '{"path":"./src","breakdown_by":"language"}'
        agentctl skills run code/stats --path ./src --breakdown_by language
        agentctl run code/stats --input '{"path":".","breakdown_by":"directory","max_depth":2}'
        agentctl skills run code/stats --path . --breakdown_by directory --max_depth 2
    workflows:
      - id: by-language
        description: "Break down stats by language."
        example_input:
          path: "./src"
          breakdown_by: "language"
      - id: by-directory
        description: "Break down stats by directory."
        example_input:
          path: "."
          breakdown_by: "directory"
          max_depth: 2
returns:
  - name: statistics
    type: object
  - name: artifact
    type: string
  - name: cas_hint
    type: object
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
