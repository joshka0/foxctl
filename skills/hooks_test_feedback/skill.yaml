apiVersion: agentctl/v1
kind: Skill
metadata:
  name: hooks/test_feedback
  version: 0.1.0
  description: "Claude Code hook that surfaces failing test results after code edits"
  tags: ["hook", "tests", "feedback", "post-tool-use"]
distribution:
  type: exec
  exec:
    entry: skills/hooks_test_feedback/hooks_test_feedback
io:
  format: JSON
  inline_output_kb: 8
signature:
  command: hooks/test_feedback
  parameters:
    - name: event
      type: string
      required: true
      description: "Hook event type (PostToolUse)"
    - name: workspace_root
      type: string
      required: false
      description: "Absolute path to workspace root"
    - name: workspace_id
      type: string
      required: false
      description: "Stable workspace ID (optional)"
    - name: session_id
      type: string
      required: false
      description: "Claude session ID"
    - name: actor_id
      type: string
      required: false
      description: "Actor identifier"
    - name: tool_name
      type: string
      required: false
      description: "Name of the tool that was just executed"
    - name: tool_canonical
      type: string
      required: false
      description: "Canonical tool name (edit.apply_patch, fs.write_file, etc.)"
    - name: tool_kind
      type: string
      required: false
      description: "Tool category: read, write, exec, search, any"
    - name: tool_input
      type: object
      required: false
      description: "Input that was passed to the tool"
    - name: tool_observation
      type: object
      required: false
      description: "Observation from the tool"
  help:
    short: "Report failing tests after tool use."
    long: |
      Use hooks/test_feedback to surface failing tests for recent edits.
      Example commands:
        agentctl run hooks/test_feedback --input '{"event":"PostToolUse","workspace_root":"/workspace/project","tool_name":"Edit"}'
        agentctl skills run hooks/test_feedback --event PostToolUse --workspace_root /workspace/project --tool_name Edit
    workflows:
      - id: post-edit-feedback
        description: "Report failures after an edit."
        example_input:
          event: "PostToolUse"
          workspace_root: "/workspace/project"
          tool_name: "Edit"
  returns:
    - name: hook_output
      type: object
      description: "Hook output with decision (always 'none'), reason, and context"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
env:
  - name: AGENTCTL_TEST_FEEDBACK_MAX_FAILURES
    description: "Maximum number of failures to show per watcher"
    default: "3"
