apiVersion: agentctl/v1
kind: Skill
metadata:
  name: lsp/gopls
  version: 0.1.0
  description: "Go language server operations: definitions, references, call hierarchy, symbols"
  tags: ["lsp", "go", "gopls", "navigation", "references"]
distribution:
  type: exec
  exec:
    entry: skills/lsp_gopls/lsp_gopls
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: lsp/gopls
  parameters:
    - name: operation
      type: string
      required: true
      enum: ["definition", "references", "call_hierarchy", "symbols", "workspace_symbol", "implementation", "check"]
      description: "LSP operation to perform"
    - name: file
      type: string
      required: false
      description: "File path (required for most operations)"
    - name: line
      type: integer
      required: false
      description: "Line number (1-based, for position-based operations)"
    - name: column
      type: integer
      required: false
      description: "Column number (1-based, for position-based operations)"
    - name: query
      type: string
      required: false
      description: "Search query (for workspace_symbol operation)"
    - name: max_results
      type: integer
      required: false
      default: 50
      description: "Maximum number of results to return"
  help:
    short: "Query Go symbols, references, and diagnostics."
    long: |
      Use lsp/gopls to query Go language server operations.
      Example commands:
        agentctl run lsp/gopls --input '{"operation":"definition","file":"main.go","line":10,"column":5}'
        agentctl skills run lsp/gopls --operation definition --file main.go --line 10 --column 5
        agentctl run lsp/gopls --input '{"operation":"workspace_symbol","query":"Handler"}'
        agentctl skills run lsp/gopls --operation workspace_symbol --query Handler
    workflows:
      - id: find-definition
        description: "Find a definition at a position."
        example_input:
          operation: "definition"
          file: "main.go"
          line: 10
          column: 5
      - id: search-symbols
        description: "Search workspace symbols."
        example_input:
          operation: "workspace_symbol"
          query: "Handler"
returns:
  - name: results
    type: array
    description: "LSP operation results"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
  cacheable: false
