apiVersion: agentctl/v1
kind: Skill
metadata:
  name: todo/manage
  version: 0.2.0
  description: "Manage nested TODOs with dependencies, completion notes, and active task tracking"
  tags: ["todo", "planning", "tasks"]
distribution:
  type: exec
  exec:
    entry: skills/todo/todo
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: todo/manage
  parameters:
    - name: operation
      type: string
      required: false
      description: "add|complete|list|get_active|set_active|clear_active|ensure_active (default list)"
    - name: workspace_id
      type: string
      required: false
      description: "Workspace identifier for task scoping (default: current working directory)"
returns:
  - name: tasks
    type: array
  - name: task
    type: object
  - name: active
    type: boolean
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
