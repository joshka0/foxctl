apiVersion: agentctl/v1
kind: Skill
metadata:
  name: hooks/session_end
  version: 0.1.0
  description: "Claude Code Stop hook that captures session metrics and prompts for feedback"
  tags: ["hook", "session", "feedback", "stop", "metrics"]
distribution:
  type: exec
  exec:
    entry: skills/hooks_session_end/session_end
io:
  format: JSON
  inline_output_kb: 8
signature:
  command: hooks/session_end
  parameters:
    - name: event
      type: string
      required: true
      description: "Hook event type (SessionEnd or legacy Stop)"
    - name: workspace_root
      type: string
      required: false
      description: "Absolute path to workspace root"
    - name: workspace_id
      type: string
      required: false
      description: "Stable workspace ID (optional)"
    - name: session_id
      type: string
      required: false
      description: "Claude session identifier"
    - name: actor_id
      type: string
      required: false
      description: "Actor identifier"
    - name: transcript_path
      type: string
      required: false
      description: "Path to conversation transcript"
  help:
    short: "Capture session metrics at end of a session."
    long: |
      Use hooks/session_end to collect session metrics on SessionEnd events.
      Example commands:
        agentctl run hooks/session_end --input '{"event":"SessionEnd","workspace_root":"/workspace/project","session_id":"abc123"}'
        agentctl skills run hooks/session_end --event SessionEnd --workspace_root /workspace/project --session_id abc123
    workflows:
      - id: session-stop
        description: "Capture metrics on Stop."
        example_input:
          event: "SessionEnd"
          workspace_root: "/workspace/project"
          session_id: "abc123"
  returns:
    - name: hook_output
      type: object
      description: "Hook output with session metrics"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
env:
  - name: AGENTCTL_SESSION_FEEDBACK_ENABLED
    description: "Enable session feedback collection (default: true)"
    default: "true"
