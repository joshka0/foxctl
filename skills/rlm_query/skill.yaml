apiVersion: foxctl/v1
kind: Skill
metadata:
  name: rlm/query
  version: 0.1.0
  description: "Run a bounded RLM query and return compact answer, evidence, retrieval paths, and tool-use metadata"
  tags: ["rlm", "query", "retrieval", "code", "pi", "openapi"]
distribution:
  type: exec
  exec:
    entry: bin
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: rlm/query
  parameters:
    - name: prompt
      type: string
      required: true
      description: "Natural-language RLM query prompt"
    - name: workspace
      type: string
      required: false
      description: "Workspace root for the RLM runtime. Required unless workspace_root is provided."
    - name: workspace_root
      type: string
      required: false
      description: "Alias for workspace root, used by Pi and web skill callers. Required unless workspace is provided."
    - name: executor
      type: string
      required: false
      default: "llm"
      enum: ["inspect", "llm", "repl"]
      description: "RLM executor mode"
    - name: llm_provider
      type: string
      required: false
      default: "openrouter"
      description: "LLM provider for executor=llm"
    - name: llm_model
      type: string
      required: false
      default: "poolside/laguna-xs.2:free"
      description: "LLM model for executor=llm"
    - name: llm_base_url
      type: string
      required: false
      description: "Optional LLM base URL override"
    - name: llm_timeout
      type: string
      required: false
      default: "60s"
      description: "LLM timeout passed to the RLM runtime"
    - name: route_profile
      type: string
      required: false
      default: "code_retrieval"
      enum: ["auto", "code_retrieval", "memory_recall", "mixed", "evidence_audit"]
      description: "RLM route profile"
    - name: tool_profile
      type: string
      required: false
      default: "code-intel"
      description: "RLM tool profile; code-intel exposes retrieve_code"
    - name: plan_mode
      type: string
      required: false
      default: "free"
      enum: ["free", "staged", "lambda-retrieval"]
      description: "RLM planning mode"
    - name: max_iterations
      type: integer
      required: false
      default: 4
      description: "Maximum root iterations"
    - name: max_depth
      type: integer
      required: false
      default: 1
      description: "Maximum recursive depth"
    - name: max_subcalls
      type: integer
      required: false
      default: 2
      description: "Maximum subcalls"
    - name: require_tool_use
      type: boolean
      required: false
      default: true
      description: "Require the LLM executor to call at least one RLM tool before answering"
  returns:
    - name: answer
      type: string
      description: "Final RLM answer"
    - name: retrieved_paths
      type: array
      description: "Repo-relative paths retrieved by the RLM run"
    - name: evidence_refs
      type: array
      description: "Evidence refs loaded or returned by the RLM run"
    - name: tool_names
      type: array
      description: "RLM tools used by the model-backed executor"
    - name: parent_total_tokens
      type: integer
      description: "Parent model token count reported by RLM metadata"
    - name: parent_tool_usage
      type: object
      description: "Tool-use counters reported by RLM metadata"
  help:
    short: "Run a bounded RLM query with compact evidence output"
    long: |
      rlm/query wraps `foxctl rlm run` for agents and Pi. It is intended for
      live dogfooding of RLM retrieval from the same OpenAPI skill surface used
      by foxctl_tool_run.

      At least one of `workspace` or `workspace_root` is required. This skill
      fails fast when neither is provided so HTTP/OpenAPI callers do not
      accidentally run RLM relative to the installed skill directory.

      The default profile uses OpenRouter plus the `code-intel` RLM tool
      surface so that code questions can use `retrieve_code`. API keys are not
      accepted as skill input; source them in the foxctl daemon environment.
      When `OPENROUTER_API_KEY` is present and `FOXCTL_RLM_LLM_API_KEY` is not,
      the skill maps it into the child process environment.

      Examples:
        foxctl run rlm/query --input '{"workspace":".","prompt":"Use retrieve_code to find skillWorkspaceRootFromInput and its caller. Return paths and functions only."}'
        foxctl skills run rlm/query --workspace . --prompt "Use retrieve_code to find skillWorkspaceRootFromInput and its caller. Return paths and functions only."
capabilities:
  network: "egress"
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
