apiVersion: foxctl/v1
kind: Skill
metadata:
  name: hooks/task_guard
  version: 0.1.0
  description: "Claude Code hook that enforces task-centric model for write operations"
  tags: ["hook", "task", "guard", "pre-tool-use"]
distribution:
  type: exec
  exec:
    entry: skills/hooks_task_guard/task_guard
io:
  format: JSON
  inline_output_kb: 8
signature:
  command: hooks/task_guard
  parameters:
    - name: event
      type: string
      required: true
      description: "Hook event type (e.g., PreToolUse)"
    - name: workspace_root
      type: string
      required: false
      description: "Absolute path to workspace root"
    - name: workspace_id
      type: string
      required: false
      description: "Stable workspace ID (optional)"
    - name: session_id
      type: string
      required: false
      description: "Claude session identifier"
    - name: actor_id
      type: string
      required: false
      description: "Actor identifier"
    - name: tool_name
      type: string
      required: false
      description: "Name of the tool being used"
    - name: tool_canonical
      type: string
      required: false
      description: "Canonical tool name (edit.apply_patch, fs.write_file, etc.)"
    - name: tool_kind
      type: string
      required: false
      description: "Tool category: read, write, exec, search, any"
    - name: tool_input
      type: object
      required: false
      description: "Raw JSON input to the tool"
  help:
    short: "Enforce task-aware guardrails on tool use."
    long: |
      Use hooks/task_guard to enforce task gating for write operations.
      Example commands:
        foxctl run hooks/task_guard --input '{"event":"PreToolUse","workspace_root":"/workspace/project","tool_name":"Edit","tool_input":{"file_path":"main.go"}}'
        foxctl skills run hooks/task_guard --event PreToolUse --workspace-root /workspace/project --tool-name Edit --tool-input '{"file_path":"main.go"}'
    workflows:
      - id: guard-edit
        description: "Guard an edit operation."
        example_input:
          event: "PreToolUse"
          workspace_root: "/workspace/project"
          tool_name: "Edit"
          tool_input:
            file_path: "main.go"
  returns:
    - name: hook_output
      type: object
      description: "Hook output with decision, reason, and metadata"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
env:
  - name: FOXCTL_TASK_GUARD_MODE
    description: "Mode: 'auto' (default) auto-creates tasks, 'strict' blocks without active task"
    default: "auto"
