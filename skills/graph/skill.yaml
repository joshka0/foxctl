apiVersion: agentctl/v1
kind: Skill
metadata:
  name: graph/manage
  version: 0.1.0
  description: "Unified dependency graph operations: add nodes/edges, query relationships, compute PageRank, and manage graph lifecycle"
  tags: ["graph", "dependencies", "relationships", "pagerank"]
distribution:
  type: exec
  exec:
    entry: skills/graph/graph
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: graph/manage
  parameters:
    - name: operation
      type: string
      required: true
      enum: ["add_node", "add_edge", "query", "neighbors", "top_nodes", "delete_node", "delete_edge", "stats", "cleanup"]
      description: "Operation to perform"
    - name: workspace
      type: string
      required: false
      description: "Workspace path (defaults to runner workspace)"
    - name: node_id
      type: string
      required: false
      description: "Node ID for operations that target a specific node"
    - name: node_type
      type: string
      required: false
      enum: ["task", "file", "symbol", "session", "memory"]
      description: "Type of node"
    - name: title
      type: string
      required: false
      description: "Node title (for add_node)"
    - name: current_path
      type: string
      required: false
      description: "Current path for file nodes"
    - name: from_id
      type: string
      required: false
      description: "Source node ID (for add_edge)"
    - name: from_type
      type: string
      required: false
      description: "Source node type (for add_edge)"
    - name: to_id
      type: string
      required: false
      description: "Target node ID (for add_edge)"
    - name: to_type
      type: string
      required: false
      description: "Target node type (for add_edge)"
    - name: edge_type
      type: string
      required: false
      enum: ["depends_on", "parent_of", "calls", "modifies", "imports", "about"]
      description: "Type of edge relationship"
    - name: edge_id
      type: string
      required: false
      description: "Edge ID (for delete_edge)"
    - name: weight
      type: number
      required: false
      description: "Edge weight (for add_edge)"
    - name: ttl_days
      type: integer
      required: false
      description: "Time-to-live in days for the edge"
    - name: direction
      type: string
      required: false
      enum: ["from", "to", "both", "in", "out"]
      description: "Direction for query/neighbors operations"
    - name: edge_types
      type: array
      required: false
      description: "Filter by edge types"
    - name: min_rank
      type: number
      required: false
      description: "Minimum PageRank for top_nodes"
    - name: limit
      type: integer
      required: false
      description: "Maximum number of results"
    - name: expired_edges
      type: boolean
      required: false
      description: "Clean up expired edges (for cleanup)"
    - name: dangling_edges
      type: boolean
      required: false
      description: "Clean up dangling edges (for cleanup)"
    - name: recalc_degrees
      type: boolean
      required: false
      description: "Recalculate node degrees (for cleanup)"
    - name: metadata
      type: object
      required: false
      description: "Additional metadata for nodes/edges"
  help:
    short: "Manage dependency graph nodes and edges."
    long: |
      Use graph/manage to add nodes, connect edges, or query relationships.
      Example commands:
        agentctl run graph/manage --input '{"operation":"add_node","node_id":"task:123","node_type":"task","title":"Implement feature"}'
        agentctl skills run graph/manage --operation add_node --node_id task:123 --node_type task --title "Implement feature"
        agentctl run graph/manage --input '{"operation":"add_edge","from_id":"task:123","from_type":"task","to_id":"file:main.go","to_type":"file","edge_type":"modifies"}'
        agentctl skills run graph/manage --operation add_edge --from_id task:123 --from_type task --to_id file:main.go --to_type file --edge_type modifies
    workflows:
      - id: add-node
        description: "Add a task node."
        example_input:
          operation: "add_node"
          node_id: "task:123"
          node_type: "task"
          title: "Implement feature"
      - id: add-edge
        description: "Connect a task to a file."
        example_input:
          operation: "add_edge"
          from_id: "task:123"
          from_type: "task"
          to_id: "file:main.go"
          to_type: "file"
          edge_type: "modifies"
returns:
  - name: result
    type: object
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: query
    POST: add_node
    PUT: add_edge
    DELETE: delete_node
