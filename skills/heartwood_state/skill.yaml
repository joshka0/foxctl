apiVersion: foxctl/v1
kind: Skill
metadata:
  name: heartwood/state
  version: 0.1.0
  description: |
    Fetch compact per-identity Heartwood state through the real generated SpacetimeDB client.
    Intended for agent participants that need room, ritual, thread, and connection context.
  tags: [heartwood, spacetime, state, ritual, connection]
distribution:
  type: exec
  exec:
    entry: skills/heartwood_state/heartwood_state
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: heartwood/state
  parameters:
    - name: heartwood_root
      type: string
      required: false
      description: Path to the Heartwood repo. Defaults to current working directory.
    - name: host
      type: string
      required: true
      description: WebSocket host for Heartwood, e.g. ws://192.168.0.243:3001
    - name: db_name
      type: string
      required: true
      description: Heartwood database name
    - name: token
      type: string
      required: false
      description: Existing SpacetimeDB session token for this agent identity
    - name: token_path
      type: string
      required: false
      description: Optional path to persist/reuse the session token for this agent
    - name: wait_timeout_ms
      type: integer
      required: false
      description: Connection and subscription wait timeout in milliseconds
    - name: message_limit
      type: integer
      required: false
      description: Number of recent thread/connection messages to include
  help:
    short: "Read Heartwood participant state."
    long: |
      Use heartwood/state to fetch the current participant-facing Heartwood state for an identity.
      Example commands:
        foxctl run heartwood/state --input '{"host":"ws://192.168.0.243:3001","db_name":"heartwood","token_path":"/tmp/hw-agent-1.token"}'
        foxctl skills run heartwood/state --host ws://192.168.0.243:3001 --db-name heartwood --token-path /tmp/hw-agent-1.token
returns:
  - name: ok
    type: boolean
  - name: identityHex
    type: string
  - name: token
    type: string
  - name: state
    type: object
capabilities:
  network: egress
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
