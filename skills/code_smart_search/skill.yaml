apiVersion: foxctl/v1
kind: Skill
metadata:
  name: code/smart_search
  version: 0.3.0
  description: "Smart code search: auto-generates candidates from indexes and extracts relevant snippets"
  tags: ["code", "search", "snippets", "retrieval", "smart", "auto"]
distribution:
  type: exec
  exec:
    entry: skills/code_smart_search/code_smart_search
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: code/smart_search
  parameters:
    - name: workspace_id
      type: string
      required: false
      default: "default"
      description: "Workspace identifier for memory store"
    - name: question
      type: string
      required: true
      description: "Natural-language question guiding candidate generation and snippet extraction"
    - name: sources
      type: array
      required: false
      items:
        type: string
        enum: ["symbols", "semantic", "ripgrep"]
      default: ["symbols", "ripgrep"]
      description: "Candidate sources to query (symbols, semantic, ripgrep)"
    - name: repo_index_mode
      type: string
      required: false
      default: auto
      description: "Repo-index contribution mode: auto (default, search-first with DAG fallback on zero hits), search (precise structural), dag (broader graph exploration), or off"
    - name: inline_mode
      type: string
      required: false
      default: auto
      enum: ["auto", "full", "preview", "artifact_only"]
      description: "How much candidate/snippet detail to inline; auto prefers preview when artifacts are present or result sets are larger"
    - name: limits
      type: object
      required: false
      properties:
        max_candidates:
          type: integer
          description: "Maximum candidates to generate (default: 50)"
        max_snippets:
          type: integer
          description: "Maximum snippets to return (default: 20)"
        max_bytes_per_file:
          type: integer
          description: "Maximum bytes to read per file (default: 65536)"
      description: "Optional limits for candidate generation and snippet extraction"
  returns:
    - name: summary
      type: object
      description: "Stats: candidates_generated, candidates_by_source, files_relevant, snippets_emitted"
    - name: candidates
      type: array
      description: "Generated candidates with path, symbol_id, score, source"
    - name: candidates_total
      type: integer
      description: "Total candidates before inline preview truncation"
    - name: snippets_inline
      type: array
      description: "Inline snippet previews"
    - name: snippets_total
      type: integer
      description: "Total snippets before inline preview truncation"
    - name: inline_mode
      type: string
      description: "Resolved inline mode used for the response"
    - name: truncated
      type: boolean
      description: "Whether inline candidates or snippets were preview-truncated"
    - name: artifact
      type: string
      description: "CAS digest of full snippets when output exceeds inline threshold"
  help:
    short: "Smart code search with auto-candidate generation from symbol/semantic indexes"
    long: |
      Smart Search combines candidate generation with snippet extraction:

      1. Generates candidates from multiple sources:
         - Symbol index: BM25 search over indexed code symbols
         - Semantic index: Embedding-based similarity (when available)
         - Ripgrep fallback: Keyword grep when indexes are sparse
         - Repo index (optional): structural search over calls/refers/imports

      2. Merges and ranks candidates by relevance score

      3. Passes candidates to code/snippet_extract for live snippet extraction

      This is the recommended entry point for code search when you don't have
      pre-determined candidate files. For direct snippet extraction from known
      files, use code/snippet_extract directly.

      Example:
        foxctl run code/smart_search --input '{
          "question": "How does user authentication work?",
          "sources": ["symbols", "ripgrep"],
          "limits": {"max_candidates": 30, "max_snippets": 15}
        }'

      Repo-index modes:
      - `auto`: precise default. Uses repo-index search first and escalates to DAG only when search returns no hits.
      - `search`: best for structural queries when you want the most direct entrypoints.
      - `dag`: best for broader graph exploration when you want neighborhood context.
      - `off`: disable repo-index contribution.
    workflows:
      - id: auto-search
        description: "Search codebase and extract relevant snippets automatically"
        example_input:
          question: "How does the workflow engine process steps?"
          sources: ["symbols", "ripgrep"]
          limits:
            max_candidates: 50
            max_snippets: 20
      - id: structural-search
        description: "Search repo-index-aware structural code paths"
        example_input:
          question: "repo index dag grep"
          repo_index_mode: "search"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
