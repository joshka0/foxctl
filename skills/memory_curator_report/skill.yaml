apiVersion: foxctl/v1
kind: Skill
metadata:
  name: memory/curator_report
  description: Generate and optionally apply a deterministic curator report for canonical memory records
  version: 0.1.0
  author: foxctl
  tags: [memory, curator, lifecycle, audit, dry-run]
distribution:
  type: exec
  exec:
    entry: bin
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: memory/curator_report
  parameters:
    - name: workspace
      type: string
      required: false
      description: Workspace path (defaults to current directory)
    - name: mode
      type: string
      required: false
      default: dry_run
      enum: [dry_run, apply]
      description: Run mode. dry_run only reports; apply mutates supported lifecycle-backed sources.
    - name: confirm_apply
      type: boolean
      required: false
      default: false
      description: Required true when mode is apply
    - name: persist_report
      type: boolean
      required: false
      default: false
      description: Store an audit report in CAS and named memory. Always enabled for apply mode.
    - name: limit
      type: integer
      required: false
      default: 1000
      description: Maximum records to inspect per memory lane (max 5000)
    - name: stale_after_days
      type: integer
      required: false
      default: 30
      description: Active records older than this with no recorded use can be proposed for stale demotion
    - name: archive_after_days
      type: integer
      required: false
      default: 90
      description: Stale records older than this can be proposed for archive
    - name: revalidate_after_days
      type: integer
      required: false
      default: 30
      description: Candidate or validated records older than this can be proposed for revalidation
    - name: revalidate_env_claims_after_days
      type: integer
      required: false
      default: 14
      description: Records marked revalidation_required are proposed for revalidation after this many days
    - name: min_uses_before_utility_judgment
      type: integer
      required: false
      default: 3
      description: Minimum use count before success-rate based stale demotion
  returns:
    - name: mode
      type: string
      description: Resolved run mode
    - name: report
      type: object
      description: Curator report with proposals, pinned skips, quarantined records, config, and summary counts
    - name: apply
      type: object
      description: Apply summary and per-proposal results when mode is apply
    - name: report_artifact
      type: string
      description: CAS digest for the persisted report when persist_report is enabled
    - name: saved_report_name
      type: string
      description: Named memory entry for the persisted report when persist_report is enabled
    - name: source_counts
      type: object
      description: Number of inspected records by source lane
    - name: unavailable_sources
      type: array
      description: Lanes that could not be read during report generation
  help:
    short: "Generate or apply a memory curator report."
    long: |
      memory/curator_report inspects canonical memory records and emits a
      deterministic curator report. By default it runs in dry_run mode and does
      not mutate memory, counters, lifecycle state, skills, or policy.

      The report proposes:
      - active -> stale demotions for low-utility or unused records
      - stale -> archived transitions for long-stale records
      - active -> deprecated transitions for superseded records
      - revalidation candidates for records marked revalidation_required
      - pinned records that require manual review before mutation
      - quarantined records that must remain evidence-only

      Apply mode requires confirm_apply=true. It only mutates source lanes with
      durable lifecycle storage. Unsupported source lanes and unsupported
      actions are reported as skipped, not silently applied.

      Example commands:
        foxctl run memory/curator_report --input '{"limit":1000}'
        foxctl run memory/curator_report --input '{"persist_report":true,"limit":1000}'
        foxctl run memory/curator_report --input '{"mode":"apply","confirm_apply":true,"limit":1000}'
        foxctl skills run memory/curator_report --limit 1000
        foxctl run memory/curator_report --input '{"stale_after_days":14,"archive_after_days":60}'
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
memory:
  recommend: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
