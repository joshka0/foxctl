apiVersion: foxctl/v1
kind: Skill
metadata:
  name: hooks/file_guard
  version: 0.1.0
  description: "Hook that manages file reservations to prevent edit conflicts"
  tags: ["hook", "file", "guard", "pre-tool-use"]
distribution:
  type: exec
  exec:
    entry: skills/hooks_file_guard/file_guard
io:
  format: JSON
  inline_output_kb: 16
signature:
  command: hooks/file_guard
  parameters:
    - name: event
      type: string
      required: true
      description: "Hook event type (e.g., PreToolUse)"
    - name: workspace_root
      type: string
      required: false
      description: "Absolute path to workspace root"
    - name: workspace_id
      type: string
      required: false
      description: "Stable workspace ID (optional)"
    - name: session_id
      type: string
      required: false
      description: "Claude session identifier"
    - name: actor_id
      type: string
      required: false
      description: "Actor identifier"
    - name: tool_name
      type: string
      required: false
      description: "Name of the tool being used"
    - name: tool_canonical
      type: string
      required: false
      description: "Canonical tool name (edit.apply_patch, fs.write_file, etc.)"
    - name: tool_kind
      type: string
      required: false
      description: "Tool category: read, write, exec, search, any"
    - name: tool_input
      type: object
      required: false
      description: "Raw JSON input to the tool"
  help:
    short: "Prevent edit conflicts via file reservations."
    long: |
      Use hooks/file_guard to prevent concurrent edits from multiple agents.
      Example commands:
        foxctl run hooks/file_guard --input '{"event":"PreToolUse","workspace_root":"/workspace/project","tool_name":"Edit","tool_input":{"file_path":"main.go"}}'
        foxctl skills run hooks/file_guard --event PreToolUse --workspace-root /workspace/project --tool-name Edit --tool-input '{"file_path":"main.go"}'
    workflows:
      - id: guard-file-edit
        description: "Guard a file edit operation."
        example_input:
          event: "PreToolUse"
          workspace_root: "/workspace/project"
          tool_name: "Edit"
          tool_input:
            file_path: "main.go"
  returns:
    - name: hook_output
      type: object
      description: "Hook output with decision, reason, context, and metadata"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
env:
  - name: FOXCTL_FILE_GUARD_MODE
    description: "Mode: 'advisory' (default) warns, 'strict' blocks on conflicts"
    default: "advisory"
