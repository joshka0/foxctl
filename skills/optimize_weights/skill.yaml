apiVersion: agentctl/v1
kind: Skill
metadata:
  name: optimize/weights
  version: 0.1.0
  description: "Manage learnable scorer weights for task prioritization"
  tags: ["optimize", "weights", "scorer", "learning"]
distribution:
  type: exec
  exec:
    entry: skills/optimize_weights/weights
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: optimize/weights
  parameters:
    - name: action
      type: string
      required: true
      description: "Action: show, learn"
    - name: workspace
      type: string
      required: false
      description: "Workspace root path"
  help:
    short: "Show or learn scorer weights."
    long: |
      Use optimize/weights to inspect or learn scoring weights.
      Example commands:
        agentctl run optimize/weights --input '{"action":"show"}'
        agentctl skills run optimize/weights --action show
        agentctl run optimize/weights --input '{"action":"learn","workspace":"./"}'
        agentctl skills run optimize/weights --action learn --workspace ./
    workflows:
      - id: show-weights
        description: "Show current weights."
        example_input:
          action: "show"
      - id: learn-weights
        description: "Learn new weights."
        example_input:
          action: "learn"
          workspace: "./"
  returns:
    - name: weights
      type: object
      description: "Current scorer weights"
    - name: update
      type: object
      description: "Learning update result"
capabilities:
  network: "none"
  filesystem:
    - type: home
    - type: workdir
  pure: false
