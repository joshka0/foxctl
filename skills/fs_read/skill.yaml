apiVersion: agentctl/v1
kind: Skill
metadata:
  name: fs/read
  version: 0.1.0
  description: "Read file contents with CAS-backed previews"
  tags: ["fs", "read", "cat"]
distribution:
  type: exec
  exec:
    entry: skills/fs_read/fs_read
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: fs/read
  parameters:
    - name: path
      type: string
      required: true
      description: "Path to the file to read"
    - name: max_bytes
      type: integer
      required: false
      description: "Override preview byte limit (capped by inline_output_kb)"
  help:
    short: "Read file contents with automatic CAS truncation."
    long: |
      Use fs/read to read files in the workspace. Large outputs are truncated and
      stored in CAS with a digest.
      Example commands:
        agentctl run fs/read --input '{"path":"./README.md"}'
        agentctl skills run fs/read --path ./README.md
        agentctl run fs/read --input '{"path":"./large.json","max_bytes":4096}'
        agentctl skills run fs/read --path ./large.json --max_bytes 4096
    workflows:
      - id: read-basic
        description: "Read README.md from the workspace."
        example_input:
          path: "./README.md"
      - id: read-preview
        description: "Read a larger file with a smaller preview."
        example_input:
          path: "./large.json"
          max_bytes: 4096
returns:
  - name: preview
    type: string
  - name: preview_numbered
    type: string
    description: "Preview with 1-based line numbers."
  - name: preview_line_count
    type: integer
    description: "Number of lines in the preview."
  - name: artifact
    type: string
  - name: cas_hint
    type: object
  - name: binary
    type: boolean
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
