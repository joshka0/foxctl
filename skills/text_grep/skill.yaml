apiVersion: agentctl/v1
kind: Skill
metadata:
  name: text/grep
  version: 0.1.0
  description: "Recursive regex search with include/exclude globs"
  tags: ["text", "search", "regex"]
distribution:
  type: exec
  exec:
    entry: skills/text_grep/text_grep
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: text/grep
  parameters:
    - name: path
      type: string
      required: false
      description: "Directory or file (default .)"
    - name: pattern
      type: string
      required: true
      description: "Go RE2 regex"
    - name: ci
      type: boolean
      required: false
      description: "Case insensitive"
      default: false
    - name: include
      type: array
      required: false
      items:
        type: string
    - name: exclude
      type: array
      required: false
      items:
        type: string
    - name: max_matches
      type: integer
      required: false
      default: 100000
  returns:
    - name: matches
      type: array
  help:
    short: "Recursive regex search with include/exclude globs."
    long: |
      Use this skill to search text files in a workspace using Go's RE2 regex engine.
      Provide a required pattern and optional path, include/exclude globs, and max_matches
      to control the output size.
      Example commands:
        agentctl run text/grep --input '{"pattern":"TODO","path":"."}'
        agentctl skills run text/grep --pattern TODO --path .
        agentctl run text/grep --input '{"pattern":"TODO","path":"./src","include":["*.go"]}'
        agentctl skills run text/grep --pattern TODO --path ./src --include '*.go'
    workflows:
      - id: basic-search
        description: "Search recursively for a pattern in the current workspace."
        example_input:
          pattern: "TODO"
          path: "."
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
