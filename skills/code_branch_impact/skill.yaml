apiVersion: foxctl/v1
kind: Skill
metadata:
  name: code/branch_impact
  version: 0.1.0
  description: "Turn a branch git diff into a compact blast-radius review pack"
  tags: ["code", "git", "review", "repoindex"]
distribution:
  type: exec
  exec:
    entry: skills/code_branch_impact/code_branch_impact
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: code/branch_impact
  parameters:
    - name: workspace
      type: string
      required: false
      description: "Workspace root (default: current workspace)"
    - name: base_ref
      type: string
      required: false
      default: HEAD
      description: "Base git ref or tree-ish for diff"
    - name: head_ref
      type: string
      required: false
      description: "Optional head ref; when set, diff uses base...head"
    - name: depth
      type: integer
      required: false
      default: 2
      description: "Repoindex blast-radius depth"
    - name: limit
      type: integer
      required: false
      default: 50
      description: "Maximum ranked candidates to return"
    - name: per_file_cap
      type: integer
      required: false
      default: 20
      description: "Maximum graph nodes to collect per changed file"
    - name: max_changed
      type: integer
      required: false
      description: "Maximum changed files to analyze from the diff"
  returns:
    - name: summary
      type: object
      description: "Counts for changed files and review ranks"
    - name: changes
      type: array
      description: "Structured changed files from git diff"
    - name: candidates
      type: array
      description: "Ranked must_review, should_review, and context_only paths"
    - name: lanes
      type: array
      description: "Availability of git, repoindex graph, and semantic lanes"
  help:
    short: "Branch diff impact review pack"
    long: |
      Use code/branch_impact to turn a git diff into a compact review pack.
      The skill combines structured git diff data with repoindex graph blast
      radius when an index exists for the workspace.

      Example:
        foxctl run code/branch_impact --input '{"base_ref":"main","head_ref":"HEAD","depth":2}'
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
