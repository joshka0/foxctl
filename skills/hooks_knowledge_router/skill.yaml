apiVersion: foxctl/v1
kind: Skill
metadata:
  name: hooks/knowledge_router
  version: 0.1.0
  description: "Claude Code hook that surfaces relevant knowledge packs based on context"
  tags: ["hook", "knowledge", "router", "advisory"]
distribution:
  type: exec
  exec:
    entry: skills/hooks_knowledge_router/knowledge_router
io:
  format: JSON
  inline_output_kb: 8
signature:
  command: hooks/knowledge_router
  parameters:
    - name: event
      type: string
      required: true
      description: "Hook event type (e.g., PreToolUse, UserPromptSubmit)"
    - name: workspace_root
      type: string
      required: false
      description: "Absolute path to workspace root"
    - name: workspace_id
      type: string
      required: false
      description: "Stable workspace ID (optional)"
    - name: session_id
      type: string
      required: false
      description: "Claude session identifier"
    - name: actor_id
      type: string
      required: false
      description: "Actor identifier"
    - name: prompt
      type: string
      required: false
      description: "Prompt text for UserPromptSubmit/LLMRequest events"
    - name: tool_name
      type: string
      required: false
      description: "Name of the tool being used (for PreToolUse)"
    - name: tool_canonical
      type: string
      required: false
      description: "Canonical tool name (edit.apply_patch, fs.read_file, etc.)"
    - name: tool_kind
      type: string
      required: false
      description: "Tool category: read, write, exec, search, any"
    - name: tool_input
      type: object
      required: false
      description: "Raw JSON input to the tool"
  help:
    short: "Recommend knowledge packs based on context."
    long: |
      Use hooks/knowledge_router to surface relevant knowledge packs.
      Example commands:
        foxctl run hooks/knowledge_router --input '{"event":"PreToolUse","workspace_root":"/workspace/project","tool_name":"Edit","tool_input":{"file_path":"main.go"}}'
        foxctl skills run hooks/knowledge_router --event PreToolUse --workspace_root /workspace/project --tool_name Edit --tool_input '{"file_path":"main.go"}'
    workflows:
      - id: route-knowledge
        description: "Recommend knowledge for a tool action."
        example_input:
          event: "PreToolUse"
          workspace_root: "/workspace/project"
          tool_name: "Edit"
          tool_input:
            file_path: "main.go"
  returns:
    - name: hook_output
      type: object
      description: "Hook output with decision (always 'none'), context hint, and recommendations"
    - name: recommendations
      type: array
      description: "List of recommended knowledge packs with scores"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: false
env:
  - name: AGENTCTL_KNOWLEDGE_THRESHOLD
    description: "Minimum score threshold for recommendations (0.0-1.0)"
    default: "0.5"
