apiVersion: foxctl/v1
kind: Skill
metadata:
  name: wasi/echo
  version: 0.1.0
  description: "Minimal WASI skill emitting a static envelope"
  tags: ["wasi", "demo"]
distribution:
  type: wasi
  wasi:
    module: module.wasm
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: wasi/echo
  parameters: []
  returns: []
  help:
    short: "Emit a static envelope from WASI."
    long: |
      Use wasi/echo as a minimal WASI skill for testing.
      Example commands:
        foxctl run wasi/echo --input '{}'
        foxctl skills run wasi/echo
    workflows:
      - id: echo
        description: "Run the WASI echo skill."
        example_input: {}
capabilities:
  network: "none"
  filesystem: []
memory:
  recommend: false
