apiVersion: foxctl/v1
kind: Skill
metadata:
  name: code/snippet_extract
  version: 0.3.0
  description: "Extract code snippets from candidate files (requires candidates - use code/smart_search if you don't have them)"
  tags: ["code", "extract", "snippets", "retrieval"]
distribution:
  type: exec
  exec:
    entry: skills/code_snippet_extract/code_snippet_extract
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: code/snippet_extract
  parameters:
    - name: workspace_id
      type: string
      required: true
      description: "Workspace identifier"
    - name: question
      type: string
      required: true
      description: "Natural-language question or task guiding snippet extraction"
    - name: query
      type: string
      required: false
      description: "Alias for 'question' (for convenience)"
    - name: inline_mode
      type: string
      required: false
      default: auto
      enum: ["auto", "full", "preview", "artifact_only"]
      description: "How much snippet detail to inline; auto prefers preview when artifacts are present or result sets are larger"
    - name: candidates
      type: array
      required: true
      items:
        type: object
        properties:
          path:
            type: string
            description: "File path relative to workspace root"
          symbol_id:
            type: string
            description: "Optional symbol ID from code symbol index"
          priority:
            type: number
            description: "Optional advisory ordering from upstream retrieval"
      description: "Candidate files/symbols to process"
    - name: limits
      type: object
      required: false
      properties:
        max_files:
          type: integer
          description: "Maximum number of candidate files to inspect"
        max_snippets:
          type: integer
          description: "Global cap on emitted snippets"
        max_bytes_per_file:
          type: integer
          description: "Cap on bytes read per file"
      description: "Optional limits for performance control"
  returns:
    - name: summary
      type: object
      description: "Aggregated stats: files_considered, files_relevant, snippets_emitted"
    - name: snippets_inline
      type: array
      description: "Inline snippet previews when total output is small"
    - name: snippets_total
      type: integer
      description: "Total snippets before inline preview truncation"
    - name: inline_mode
      type: string
      description: "Resolved inline mode used for the response"
    - name: truncated
      type: boolean
      description: "Whether inline snippets were preview-truncated or moved behind an artifact"
    - name: artifact
      type: string
      description: "CAS digest of full NDJSON snippets when output is large"
    - name: related_sessions
      type: array
      description: "Context hints from related past sessions (when embeddings available)"
    - name: related_sessions_hint
      type: string
      description: "Non-fatal hint when session context is unavailable (e.g., missing API key)"
  help:
    short: "Extract high-signal code snippets from candidate files for a question."
    long: |
      SWE Grep is the final stage in the code retrieval funnel:
      1. Semantic/symbol indexes provide candidate files/symbols (Phase 3/4).
      2. SWE Grep reads those files live from the workspace.
      3. It extracts relevant snippets based on the question.
      4. (New) Searches for related past sessions to provide context hints.

      The skill always reads live workspace files (not cached index data) to ensure
      snippets reflect the current tree. Large results are stored in CAS as NDJSON.

      When GEMINI_API_KEY is set, the skill also searches for related past sessions
      using semantic similarity. This provides context hints including:
      - Session summaries describing what was worked on
      - Gotchas and learnings from those sessions
      - Key decisions that were made
      - Key files that were touched

      Environment Variables:
      - GEMINI_API_KEY: Required for session context search (optional)
      - EMBEDDING_MODEL: Model name (default: "gemini-embedding-001")

      See docs/spec/code_symbol_index_and_swe_grep.md §5 for the full contract.

      Example commands:
        foxctl run code/snippet_extract --input '{"workspace_id":"my-workspace","question":"How does user authentication work?","candidates":[{"path":"internal/auth/login.go","symbol_id":"internal/auth/login.go:Login","priority":0.95},{"path":"internal/auth/session.go"}],"limits":{"max_files":10,"max_snippets":20}}'
        foxctl skills run code/snippet_extract --workspace_id my-workspace --question "How does user authentication work?" --candidates '[{"path":"internal/auth/login.go","symbol_id":"internal/auth/login.go:Login","priority":0.95},{"path":"internal/auth/session.go"}]' --limits '{"max_files":10,"max_snippets":20}'
    workflows:
      - id: extract-snippets-for-question
        description: "Extract code snippets relevant to a question from candidates."
        example_input:
          workspace_id: "my-workspace"
          question: "How does user authentication work?"
          candidates:
            - path: "internal/auth/login.go"
              symbol_id: "internal/auth/login.go:Login"
              priority: 0.95
            - path: "internal/auth/session.go"
          limits:
            max_files: 10
            max_snippets: 20
capabilities:
  network: "egress"  # For embedding API calls (session context search)
  filesystem:
    - type: workdir
  pure: false  # Uses external embedding API when available
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
