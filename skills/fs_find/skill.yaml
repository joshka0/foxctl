apiVersion: foxctl/v1
kind: Skill
metadata:
  name: fs/find
  version: 0.1.0
  description: "Advanced file discovery with multi-signal ranking: name, path, size, modified time"
  tags: ["filesystem", "search", "discovery"]
distribution:
  type: exec
  exec:
    entry: skills/fs_find/fs_find
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: fs/find
  parameters:
    - name: query
      type: string
      required: false
      description: "Search query for fuzzy matching filenames and paths"
    - name: path
      type: string
      required: false
      description: "Starting directory (default .)"
    - name: pattern
      type: string
      required: false
      description: "Glob pattern for filenames (e.g., '*.go', '*.{js,ts}')"
    - name: type
      type: string
      required: false
      enum: ["file", "directory", "any"]
      default: "file"
      description: "Type of entries to find"
    - name: min_size
      type: integer
      required: false
      description: "Minimum file size in bytes"
    - name: max_size
      type: integer
      required: false
      description: "Maximum file size in bytes"
    - name: modified_since
      type: string
      required: false
      description: "Find files modified since (e.g., '7d', '1w', '1m')"
    - name: max_depth
      type: integer
      required: false
      default: 0
      description: "Maximum directory depth (0 = unlimited)"
    - name: hidden
      type: boolean
      required: false
      default: false
      description: "Include hidden files and directories"
    - name: sort_by
      type: string
      required: false
      enum: ["relevance", "name", "size", "modified"]
      default: "relevance"
      description: "Sort order for results"
    - name: max_results
      type: integer
      required: false
      default: 100
      description: "Maximum number of results"
  help:
    short: "Find files and directories with ranking and filters."
    long: |
      Use fs/find to locate files with fuzzy matching, size filters, and sorting.
      Example commands:
        foxctl run fs/find --input '{"query":"config","path":"."}'
        foxctl skills run fs/find --query config --path .
        foxctl run fs/find --input '{"pattern":"*.go","type":"file","sort_by":"modified","max_results":20}'
        foxctl skills run fs/find --pattern '*.go' --type file --sort_by modified --max_results 20
    workflows:
      - id: find-config
        description: "Find config files by name."
        example_input:
          query: "config"
          path: "."
      - id: find-go-files
        description: "List recently modified Go files."
        example_input:
          pattern: "*.go"
          type: "file"
          sort_by: "modified"
          max_results: 20
returns:
  - name: files
    type: array
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
