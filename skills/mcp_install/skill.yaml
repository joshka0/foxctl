apiVersion: foxctl/v1
kind: Skill
metadata:
  name: mcp/install
  version: 1.0.0
  description: Introspects an MCP server and installs skills for each tool
distribution:
  type: exec
  exec:
    entry: bin
io:
  format: JSON
capabilities:
  network: "none"
  filesystem:
    - type: workdir
signature:
  command: mcp/install
  parameters:
    - name: server_cmd
      type: string
      required: false
      description: The executable command to start the MCP server
    - name: server_args
      type: array
      required: false
      description: Arguments for the server command
      items:
        type: string
    - name: server_env
      type: object
      required: false
      description: Environment variables for the server
    - name: output_dir
      type: string
      required: false
      description: Directory where generated skills will be placed (defaults to current directory)
    - name: bridge_path
      type: string
      required: false
      description: Path to the mcp_bridge binary to use in generated skills (defaults to "mcp_bridge")
    - name: server_url
      type: string
      required: false
      description: URL of the MCP server (SSE)
    - name: server_headers
      type: object
      required: false
      description: HTTP headers for SSE connection
  help:
    short: "Install skills from an MCP server."
    long: |
      Use mcp/install to discover MCP tools and generate skill manifests.
      Example commands:
        foxctl run mcp/install --input '{"server_url":"http://localhost:8080/sse","output_dir":"./skills"}'
        foxctl skills run mcp/install --server-url http://localhost:8080/sse --output-dir ./skills
    workflows:
      - id: install-from-url
        description: "Install MCP tools from a server URL."
        example_input:
          server_url: "http://localhost:8080/sse"
          output_dir: "./skills"
