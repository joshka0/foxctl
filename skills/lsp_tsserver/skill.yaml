apiVersion: agentctl/v1
kind: Skill
metadata:
  name: lsp/tsserver
  version: 0.1.0
  description: "TypeScript/JavaScript language server operations via typescript-language-server"
  tags: ["lsp", "typescript", "javascript", "tsserver", "navigation", "references"]
distribution:
  type: exec
  exec:
    entry: skills/lsp_tsserver/lsp_tsserver
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: lsp/tsserver
  parameters:
    - name: operation
      type: string
      required: true
      enum: ["definition", "references", "symbols", "workspace_symbol", "hover", "diagnostics"]
      description: "LSP operation to perform"
    - name: file
      type: string
      required: false
      description: "File path (required for most operations)"
    - name: line
      type: integer
      required: false
      description: "Line number (1-based, for position-based operations)"
    - name: column
      type: integer
      required: false
      description: "Column number (1-based, for position-based operations)"
    - name: query
      type: string
      required: false
      description: "Search query (for workspace_symbol operation)"
    - name: max_results
      type: integer
      required: false
      default: 50
      description: "Maximum number of results to return"
  help:
    short: "Query TypeScript/JavaScript symbols and diagnostics."
    long: |
      Use lsp/tsserver to query TypeScript/JavaScript language server operations.
      Example commands:
        agentctl run lsp/tsserver --input '{"operation":"definition","file":"src/index.ts","line":15,"column":3}'
        agentctl skills run lsp/tsserver --operation definition --file src/index.ts --line 15 --column 3
        agentctl run lsp/tsserver --input '{"operation":"workspace_symbol","query":"useEffect"}'
        agentctl skills run lsp/tsserver --operation workspace_symbol --query useEffect
    workflows:
      - id: find-definition
        description: "Find a definition in a TS file."
        example_input:
          operation: "definition"
          file: "src/index.ts"
          line: 15
          column: 3
      - id: search-symbols
        description: "Search workspace symbols."
        example_input:
          operation: "workspace_symbol"
          query: "useEffect"
returns:
  - name: results
    type: array
    description: "LSP operation results"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
  cacheable: false
