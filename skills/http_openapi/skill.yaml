apiVersion: agentctl/v1
kind: Skill
metadata:
  name: http/openapi
  version: 0.1.0
  description: "OpenAPI operation executor with auth, pagination, retry, and dry-run support"
  tags: ["openapi", "http"]
distribution:
  type: exec
  exec:
    entry: skills/http_openapi/http_openapi
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: http/openapi
  parameters:
    - name: spec
      type: string
      required: true
      description: "Spec path, URL, or memory: reference"
    - name: operationId
      type: string
      required: true
      description: OpenAPI operationId to invoke
    - name: params
      type: object
      required: false
      description: Parameters for path/query/header/body values
    - name: auth
      type: object
      required: false
      description: Authentication configuration
    - name: paging
      type: object
      required: false
      description: Pagination strategy configuration
    - name: retry
      type: object
      required: false
      description: Retry behavior configuration
    - name: dry_run
      type: boolean
      required: false
      default: true
  help:
    short: "Execute or dry-run an OpenAPI operation."
    long: |
      Use http/openapi to load an OpenAPI 3.x spec, build an operation request,
      apply auth, and optionally execute it with pagination and retry support.
      Example commands:
        agentctl run http/openapi --input '{"spec":"./openapi.yaml","operationId":"listRepos","params":{"path":{},"query":{"per_page":10}},"dry_run":true}'
        agentctl run http/openapi --input '{"spec":"memory:github","operationId":"createIssue","params":{"body":{"title":"Bug"}},"auth":{"bearer_env":"GITHUB_TOKEN"},"dry_run":false}'
    workflows:
      - id: dry-run-operation
        description: "Build a request plan without executing it."
        example_input:
          spec: "./openapi.yaml"
          operationId: "listRepos"
          params:
            query:
              per_page: 10
          dry_run: true
      - id: execute-operation
        description: "Execute an authenticated operation."
        example_input:
          spec: "memory:github"
          operationId: "createIssue"
          params:
            body:
              title: "Bug"
          auth:
            bearer_env: "GITHUB_TOKEN"
          dry_run: false
returns:
  - name: summary
    type: object
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
