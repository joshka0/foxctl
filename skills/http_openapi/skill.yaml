apiVersion: agentctl/v1
kind: Skill
metadata:
  name: http/openapi
  version: 0.1.0
  description: "Simple OpenAPI dry-run planner"
  tags: ["openapi", "http"]
distribution:
  type: exec
  exec:
    entry: skills/http_openapi/http_openapi
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: http/openapi
  parameters:
    - name: base_url
      type: string
      required: true
    - name: path
      type: string
      required: true
    - name: method
      type: string
      required: false
      default: GET
    - name: query
      type: object
      required: false
    - name: headers
      type: object
      required: false
    - name: body
      type: object
      required: false
    - name: dry_run
      type: boolean
      required: false
      default: true
  help:
    short: "Plan an OpenAPI request without network access."
    long: |
      Use http/openapi to generate a request plan from basic OpenAPI inputs.
      Example commands:
        agentctl run http/openapi --input '{"base_url":"https://api.example.com","path":"/repos/octocat/hello","method":"GET","dry_run":true}'
        agentctl skills run http/openapi --base_url https://api.example.com --path /repos/octocat/hello --method GET --dry_run
        agentctl run http/openapi --input '{"base_url":"https://api.example.com","path":"/issues","method":"POST","body":{"title":"Bug"},"dry_run":true}'
        agentctl skills run http/openapi --base_url https://api.example.com --path /issues --method POST --body '{"title":"Bug"}' --dry_run
    workflows:
      - id: get-request
        description: "Plan a GET request."
        example_input:
          base_url: "https://api.example.com"
          path: "/repos/octocat/hello"
          method: "GET"
          dry_run: true
      - id: post-request
        description: "Plan a POST request with a JSON body."
        example_input:
          base_url: "https://api.example.com"
          path: "/issues"
          method: "POST"
          body:
            title: "Bug"
          dry_run: true
returns:
  - name: request_plan
    type: object
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
