apiVersion: foxctl/v1
kind: Skill
metadata:
  name: repo/index_dag_grep
  version: 0.1.0
  description: "Search repo index and return a compact explanation DAG"
  tags: ["repoindex", "graph", "dag", "search"]
distribution:
  type: exec
  exec:
    entry: skills/repo_index_dag_grep/repo_index_dag_grep
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: repo/index_dag_grep
  parameters:
    - name: query
      type: string
      required: true
      description: "Search query"
    - name: workspace
      type: string
      required: false
      description: "Workspace root (default: current workspace)"
    - name: mode
      type: string
      required: false
      description: "Search mode: fts, semantic, or hybrid"
    - name: k
      type: integer
      required: false
      description: "Number of seed nodes"
    - name: node_kinds
      type: array
      required: false
      items:
        type: string
    - name: edge_sets
      type: array
      required: false
      items:
        type: string
    - name: edge_types
      type: array
      required: false
      items:
        type: string
    - name: direction
      type: string
      required: false
      description: "Traversal direction"
    - name: depth
      type: integer
      required: false
      description: "Traversal depth"
    - name: budget
      type: integer
      required: false
      description: "Maximum nodes to return"
    - name: per_node_cap
      type: integer
      required: false
      description: "Maximum edges per node"
    - name: include_anchors
      type: boolean
      required: false
      description: "Include projected anchors"
    - name: render
      type: string
      required: false
      description: "Render format: tree or mermaid"
  returns:
    - name: result
      type: object
      description: "DAG grep result"
    - name: anchors
      type: array
      description: "Projected anchors"
    - name: rendered
      type: object
      description: "Optional rendered views"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
