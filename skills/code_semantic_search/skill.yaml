apiVersion: foxctl/v1
kind: Skill
metadata:
  name: code/semantic_search
  description: Unified semantic search across code, session, memory, dreams, and ContextWiki context with BM25/vector fallback
  version: 0.3.0
  author: foxctl
  tags: [search, semantic, embedding, symbols, sessions, memories, codemaps, dreams]
distribution:
  type: exec
  exec:
    entry: code_semantic_search
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: code/semantic_search
  parameters:
    - name: query
      type: string
      required: true
      description: Natural language query to search for
    - name: scope
      type: array
      required: false
      default: ["symbols", "sessions", "memories", "tasks", "codemaps"]
      description: Sources to search (symbols, sessions, memories, tasks, codemaps, context, dreams)
    - name: profile
      type: string
      required: false
      default: default
      description: Retrieval profile - "default" for blended search, "code" for code-only symbols+codemaps search
    - name: workspace
      type: string
      required: false
      description: Workspace path (defaults to current directory)
    - name: vault_path
      type: string
      required: false
      description: Optional vault path override for scope=["context"] or scope=["dreams"] (otherwise uses FOXCTL_CONTEXTWIKI_VAULT_PATH or FOXCTL_OBSIDIAN_VAULT_PATH)
    - name: limit
      type: integer
      required: false
      default: 20
      description: Maximum number of results to return
    - name: min_similarity
      type: number
      required: false
      default: 0.3
      description: Minimum similarity threshold (0-1)
    - name: include_context
      type: boolean
      required: false
      default: true
      description: Include context hints from session matches
    - name: memory_decay_enabled
      type: boolean
      required: false
      default: false
      description: Enable opt-in search-time recency decay for memory-scope ranking
    - name: rerank_enabled
      type: boolean
      required: false
      default: false
      description: Enable local Qwen/OpenAI-compatible reranking after first-stage fusion
    - name: rerank_top_k
      type: integer
      required: false
      default: 50
      description: Number of fused candidates to send to the reranker
    - name: rerank_model
      type: string
      required: false
      default: Qwen/Qwen3-Reranker-0.6B
      description: Reranker model override
    - name: remote
      type: boolean
      required: false
      default: false
      description: Use remote Turso database for cross-workspace search
    - name: global
      type: boolean
      required: false
      default: false
      description: Search across ALL workspaces (requires remote=true)
    - name: workspaces
      type: array
      required: false
      description: Specific workspaces to search (requires remote=true)
    - name: format
      type: string
      required: false
      default: json
      description: Output format - "json" (default) or "tree" (displays file paths as directory tree)
    - name: inline_mode
      type: string
      required: false
      default: auto
      enum: ["auto", "full", "preview", "artifact_only"]
      description: How much result detail to inline; auto prefers preview + artifact for larger outputs
    - name: repo_index_mode
      type: string
      required: false
      default: auto
      description: "Symbol/code scope only. Repo-index contribution mode: auto (default, search-first with DAG fallback on zero hits), search (precise structural), dag (broader graph exploration), or off"
    - name: timeline
      type: boolean
      required: false
      default: false
      description: Enrich session results with timeline data (chunk summaries and learnings)
    - name: timeline_limit
      type: integer
      required: false
      default: 3
      description: Maximum number of sessions to fetch timeline data for
    - name: timeline_types
      type: array
      required: false
      description: Learning types to include in timeline (decision, gotcha, preference, anti_pattern, learning)
  returns:
    - name: query
      type: string
      description: The search query
    - name: results
      type: array
      description: Ranked search results from all sources
    - name: results_total
      type: integer
      description: Total ranked results before inline preview truncation
    - name: candidate_bundles
      type: array
      description: Grouped candidate bundles for downstream narrowing (machine-usable wide-stage handoff)
    - name: candidate_bundles_total
      type: integer
      description: Total candidate bundles before inline preview truncation
    - name: context_hints
      type: array
      description: Context hints from related sessions
    - name: context_hints_total
      type: integer
      description: Total context hints before inline preview truncation
    - name: stats
      type: object
      description: Search statistics (counts, latencies, missing sources)
    - name: inline_mode
      type: string
      description: Resolved inline mode used for the response
    - name: tree_text
      type: string
      description: ASCII tree visualization of related files (present when format=tree)
    - name: tree_text_truncated
      type: boolean
      description: Whether the inline tree text was truncated in preview mode
    - name: timelines
      type: array
      description: Timeline data for matched sessions (present when timeline=true)
    - name: timelines_total
      type: integer
      description: Total timelines before inline preview truncation
    - name: artifact
      type: string
      description: CAS artifact digest for the full untruncated output when previewed inline
  help:
    short: "Search code, sessions, and memories with semantic understanding"
    long: |
      code/semantic_search performs unified semantic search across multiple
      knowledge sources using BM25 text search, vector similarity, and ripgrep,
      combining results with Reciprocal Rank Fusion (RRF).

      Sources:
      - symbols: Code symbols via retrieval.Generator (BM25 + vector + ripgrep)
      - sessions: Past Claude Code sessions with summaries/gotchas (vector search)
      - memories: Named memories with semantic content (BM25 text search)
      - tasks: Task embeddings for work context (vector search)
      - codemaps: Semantic codemaps showing code relationships (vector search)
      - context: ContextWiki top-of-mind + latest handoff + knowledge-vault retrieval (bounded blended retrieval)
      - dreams: Agent-blurred transcript dreams from the Obsidian vault index (scope is opt-in)

      The search:
      1. Generates query embedding once (reused across sources)
      2. Symbols: Uses retrieval.Generator for hybrid search (BM25 + semantic + ripgrep)
      3. Sessions: Performs vector similarity search on session embeddings
      4. Memories: Performs BM25 text search on named memories
      5. Context scope can use the ContextWiki control plane and clean Obsidian vault when configured
      6. Dreams scope searches agent-blurred dream notes from the Obsidian vault index
      7. Combines results using Reciprocal Rank Fusion (RRF)
      8. Extracts context hints from matching sessions

      Memory decay:
      - memory_decay_enabled=true applies a soft search-time recency rerank only
        to memory-scope candidates.
      - It widens the memory candidate pool before reranking and then truncates
        back to the requested limit.
      - min_similarity eligibility uses the pre-decay memory score so old strong
        matches can still enter fusion even when the displayed decayed score is
        lower.
      - It does not prune, delete, or promote memories.

      Repo-index modes for `scope:["symbols"]`:
      - `auto`: precise default. Uses repo-index search first and only falls back to DAG when search returns no hits.
      - `search`: best for structural queries when you want direct code entrypoints.
      - `dag`: broader graph exploration.
      - `off`: disable repo-index contribution.

      Environment Variables:
      - FOXCTL_EMBEDDING_PROVIDER: Embedding provider (openai_compat/lmstudio by default)
      - FOXCTL_EMBEDDING_MODEL: Embedding model (text-embedding-qwen3-embedding-8b by default)
      - FOXCTL_EMBEDDING_BASE_URL: OpenAI-compatible embedding endpoint
      - FOXCTL_RERANK_ENABLED: Enable local Qwen/OpenAI-compatible reranking
      - FOXCTL_RERANK_BASE_URL: OpenAI-compatible rerank endpoint
      - FOXCTL_RERANK_MODEL: Reranker model (Qwen/Qwen3-Reranker-0.6B by default)
      - TURSO_DATABASE_URL: Remote Turso database URL (required for remote=true)
      - TURSO_AUTH_TOKEN: Remote Turso auth token (required for remote=true)
      - FOXCTL_CONTEXTWIKI_VAULT_PATH or FOXCTL_OBSIDIAN_VAULT_PATH: Vault path for scope=["context"] and scope=["dreams"]

      Without an API key:
      - Symbol search works via BM25 text matching and ripgrep fallback
      - Session search gracefully skipped (hint provided)
      - Memory search works via BM25 text matching
      - Context scope falls back to control-plane-only results when no vault path is configured

      Timeouts:
      - Per-source: 500ms
      - Total: 2s

      Context hints surface relevant past solutions, gotchas, and decisions
      from sessions that solved similar problems.

      Remote/Cross-Workspace Search:
      When remote=true, the skill uses Turso for cross-workspace search:
      - remote=true, global=true: Search across ALL workspaces
      - remote=true, workspaces=["ws1","ws2"]: Search specific workspaces
      - Requires TURSO_DATABASE_URL and TURSO_AUTH_TOKEN environment variables
      - Embedding dimensions must match the configured model and vector store

      Example commands:
        foxctl run code/semantic_search --input '{"query":"authentication middleware","scope":["symbols"],"limit":10}'
        foxctl run code/semantic_search --input '{"query":"repo index dag grep","scope":["symbols"],"repo_index_mode":"search"}'
        foxctl skills run code/semantic_search --query "authentication middleware" --scope symbols --limit 10
        foxctl run code/semantic_search --input '{"query":"current sprint context","scope":["memories"],"memory_decay_enabled":true,"limit":10}'
        foxctl run code/semantic_search --input '{"query":"database migration issues","scope":["sessions"],"include_context":true}'
        foxctl run code/semantic_search --input '{"query":"bounded actor local context","scope":["dreams"],"vault_path":"~/.foxctl/dream-vault-preview","limit":5}'
        foxctl skills run code/semantic_search --query "database migration issues" --scope sessions --include-context
    workflows:
      - id: search-all
        description: "Search all sources for a question"
        example_input:
          query: "How does error handling work?"
          include_context: true
      - id: search-symbols
        description: "Search only code symbols"
        example_input:
          query: "authentication middleware"
          scope: ["symbols"]
          limit: 10
      - id: search-code-profile
        description: "Use code-only defaults without session/memory/context blending"
        example_input:
          query: "legacy agent runtime scout role"
          profile: "code"
          format: "tree"
      - id: search-sessions
        description: "Find relevant past sessions"
        example_input:
          query: "database migration issues"
          scope: ["sessions"]
          include_context: true
      - id: search-global
        description: "Search across all workspaces"
        example_input:
          query: "authentication patterns"
          remote: true
          global: true
          scope: ["sessions", "memories"]
      - id: search-codemaps
        description: "Find relevant codemaps showing code relationships"
        example_input:
          query: "how does authentication connect to database"
          scope: ["codemaps"]
      - id: search-context
        description: "Search the ContextWiki control plane and clean vault context"
        example_input:
          query: "v2 tool parity"
          scope: ["context"]
      - id: search-tree
        description: "Show related files as a directory tree"
        example_input:
          query: "embedding vector search"
          scope: ["symbols"]
          format: "tree"
      - id: search-timeline
        description: "Search sessions and show what happened"
        example_input:
          query: "database migration issues"
          scope: ["sessions"]
          timeline: true
          timeline_limit: 3
capabilities:
  network: "egress"
  filesystem:
    - type: workdir
  pure: false
memory:
  recommend: false
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
