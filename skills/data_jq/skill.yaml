apiVersion: agentctl/v1
kind: Skill
metadata:
  name: data/jq
  version: 0.1.0
  description: "Process JSON/YAML using jq query language"
  tags: ["jq", "json", "yaml", "query", "data"]
distribution:
  type: exec
  exec:
    entry: skills/data_jq/data_jq
io:
  format: JSON
  inline_output_kb: 64
signature:
  command: data/jq
  parameters:
    - name: query
      type: string
      required: true
      description: "JQ query expression (e.g., '.data.items[] | select(.active)')"
    - name: input
      type: string
      required: true
      description: "JSON/YAML input data"
    - name: raw_output
      type: boolean
      required: false
      default: false
      description: "Output raw strings, not JSON"
    - name: compact
      type: boolean
      required: false
      default: false
      description: "Compact instead of pretty-printed output"
    - name: slurp
      type: boolean
      required: false
      default: false
      description: "Read entire input stream into array"
    - name: sort_keys
      type: boolean
      required: false
      default: false
      description: "Sort object keys in output"
    - name: yaml_input
      type: boolean
      required: false
      default: false
      description: "Parse input as YAML (requires gojq; standard jq does not support --yaml-input)"
  help:
    short: "Run jq queries against inline JSON or YAML."
    long: |
      Use data/jq to filter or transform JSON/YAML inputs.
      Note: the skill parameter is named "input", so with agentctl skills run,
      pass the full JSON input via --input and set --query as a flag.
      Example commands:
        agentctl run data/jq --input '{"query":".items[] | .id","input":"{\"items\":[{\"id\":1},{\"id\":2}]}"}'
        agentctl skills run data/jq --query '.items[] | .id' --input '{"input":"{\"items\":[{\"id\":1},{\"id\":2}]}" }'
        agentctl run data/jq --input '{"query":".name","input":"name: example","yaml_input":true}'
        agentctl skills run data/jq --query '.name' --input '{"input":"name: example","yaml_input":true}'
    workflows:
      - id: jq-basic
        description: "Extract IDs from a JSON list."
        example_input:
          query: ".items[] | .id"
          input: "{\"items\":[{\"id\":1},{\"id\":2}]}"
      - id: jq-yaml
        description: "Parse YAML input."
        example_input:
          query: ".name"
          input: "name: example"
          yaml_input: true
returns:
  - name: result
    type: object
    description: "Query result"
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
openapi:
  enabled: true
  methods:
    GET: "true"
    POST: "true"
