apiVersion: agentctl/v1
kind: Skill
metadata:
  name: code/diff
  version: 0.1.0
  description: "File comparison and diff analysis: unified diff, side-by-side, statistics, change detection"
  tags: ["code", "diff", "comparison", "changes"]
distribution:
  type: exec
  exec:
    entry: skills/code_diff/code_diff
io:
  format: JSON
  inline_output_kb: 32
signature:
  command: code/diff
  parameters:
    - name: old_path
      type: string
      required: true
      description: "Path to old/original file"
    - name: new_path
      type: string
      required: true
      description: "Path to new/modified file"
    - name: format
      type: string
      required: false
      enum: ["unified", "stats", "summary"]
      default: "unified"
      description: "Output format"
    - name: context_lines
      type: integer
      required: false
      default: 3
      description: "Number of context lines for unified diff"
    - name: ignore_whitespace
      type: boolean
      required: false
      default: false
      description: "Ignore whitespace changes"
  help:
    short: "Compare two files and emit diffs or stats."
    long: |
      Use code/diff to compare two files and produce unified diffs or summary
      statistics.
      Example commands:
        agentctl run code/diff --input '{"old_path":"./before.go","new_path":"./after.go","format":"unified"}'
        agentctl skills run code/diff --old_path ./before.go --new_path ./after.go --format unified
        agentctl run code/diff --input '{"old_path":"./before.go","new_path":"./after.go","format":"stats","ignore_whitespace":true}'
        agentctl skills run code/diff --old_path ./before.go --new_path ./after.go --format stats --ignore_whitespace
    workflows:
      - id: unified-diff
        description: "Show a unified diff."
        example_input:
          old_path: "./before.go"
          new_path: "./after.go"
          format: "unified"
      - id: stats-diff
        description: "Show stats, ignoring whitespace."
        example_input:
          old_path: "./before.go"
          new_path: "./after.go"
          format: "stats"
          ignore_whitespace: true
returns:
  - name: diff
    type: object
capabilities:
  network: "none"
  filesystem:
    - type: workdir
  pure: true
