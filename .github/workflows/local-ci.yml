name: Local CI

on:
  workflow_dispatch:

env:
  GOFLAGS: "-buildvcs=false"

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format (gofumpt)
        run: |
          make fmt
          git diff --exit-code || (echo 'Formatting changed files. Run make fmt locally.' && exit 1)

      - name: Lint (golangci-lint)
        run: make lint

      - name: Check large files
        run: make check-large-files

      - name: Check tech debt (TODO/FIXME count)
        run: make check-tech-debt

  unit-tests:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests
        run: |
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make test-short-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            go test -short -v -count=1 ./...
          fi

  race-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Race tests
        run: |
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make test-race-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            make test-race
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build CLI
        run: make build

      - name: Build skills pack
        run: |
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make skills-build-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            make skills-build
          fi

      - name: Check skill manifests (policy)
        run: go run ./scripts/checkmanifests

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run integration tests
        run: |
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make test-integration-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            make test-integration
          fi
