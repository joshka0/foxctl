name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'configs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.vscode/**'
      - '.idea/**'
      - '.claude/**'
      - 'LICENSE'
      - 'CODEOWNERS'
      - '.gitignore'
      - '.editorconfig'
      - 'renovate.json'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'configs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.vscode/**'
      - '.idea/**'
      - '.claude/**'
      - 'LICENSE'
      - 'CODEOWNERS'
      - '.gitignore'
      - '.editorconfig'
      - 'renovate.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  label-ai:
    runs-on: arc-runner-foxctl
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions-ecosystem/action-add-labels@v1
        if: startsWith(github.head_ref, 'codex/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ai-generated

  static-analysis:
    runs-on: arc-runner-foxctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/foxctl-ci:go1.26.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-${{ runner.os }}-go1.26.1-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-go1.26.1-

      - name: Install golangci-lint (pinned)
        env:
          GOTOOLCHAIN: go1.26.1
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Format (gofumpt)
        run: |
          cd "$GITHUB_WORKSPACE"
          make fmt
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -c core.filemode=false diff --exit-code || (echo 'Formatting changed files. Run make fmt locally.' && exit 1)
          else
            echo 'No git repository metadata; skipping formatting diff check.'
          fi

      - name: Lint (golangci-lint)
        env:
          GOTOOLCHAIN: go1.26.1
        run: make lint

      - name: Check large files
        run: make check-large-files

      - name: Check tech debt (TODO/FIXME count)
        run: make check-tech-debt

  unit-tests:
    runs-on: arc-runner-foxctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/foxctl-ci:go1.26.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-go1.26.1-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-go1.26.1-

      - name: Unit tests
        run: |
          echo "::group::Unit test results"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make test-short-impacted BASE_REF="${{ github.event.pull_request.base.sha }}" HEAD_REF="${{ github.sha }}" 2>&1 | tee /tmp/test-output.txt
          else
            CGO_ENABLED=0 go test -short -v -count=1 -timeout 20m ./... 2>&1 | tee /tmp/test-output.txt
          fi
          echo "::endgroup::"
          echo "## Test timing summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '(^--- |ok\s+|FAIL\s+|panic)' /tmp/test-output.txt | head -100 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  race-tests:
    runs-on: arc-runner-foxctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/foxctl-ci:go1.26.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-go1.26.1-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-go1.26.1-

      - name: Race tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make test-race-impacted BASE_REF="${{ github.event.pull_request.base.sha }}" HEAD_REF="${{ github.sha }}"
          else
            make test-race
          fi

  build:
    runs-on: arc-runner-foxctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/foxctl-ci:go1.26.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-go1.26.1-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-go1.26.1-

      - name: Build CLI
        run: make build

      - name: Build skills pack
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make skills-build-impacted BASE_REF="${{ github.event.pull_request.base.sha }}" HEAD_REF="${{ github.sha }}"
          else
            make skills-build
          fi

      - name: Check skill manifests (policy)
        run: go run ./scripts/checkmanifests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foxctl-${{ runner.os }}-go1.26.1
          path: |
            bin/foxctl
            dist/skills/**

  cgo-build-and-tests:
    runs-on: arc-runner-foxctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/foxctl-ci:go1.26.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Temporary: install libsqlite3-dev until CI image is rebuilt with it bundled
      - name: Install libsqlite3-dev
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cgo-${{ runner.os }}-go1.26.1-${{ hashFiles('**/go.sum') }}
          restore-keys: go-cgo-${{ runner.os }}-go1.26.1-

      - name: Build CLI (CGO + libsqlite3)
        run: make build-cgo

      - name: Unit tests (CGO + libsqlite3)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make test-cgo-short-impacted BASE_REF="${{ github.event.pull_request.base.sha }}" HEAD_REF="${{ github.sha }}"
          else
            make test-cgo-short
          fi

      - name: Regression harness
        run: bash tests/regression/run.sh

      - name: Native libsql vector path test (required)
        env:
          AGENTCTL_V2_REQUIRE_NATIVE_VECTOR_SQL: "1"
        run: |
          CGO_ENABLED=1 go test -tags=libsqlite3 ./internal/v2/adapters/libsql/turns \
            -run TestTurnStore_SearchArtifactsByEmbedding_VectorPathLibSQL \
            -count=1 -v

  integration-tests:
    runs-on: arc-runner-foxctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/foxctl-ci:go1.26.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-go1.26.1-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-go1.26.1-

      - name: Run integration tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make test-integration-impacted BASE_REF="${{ github.event.pull_request.base.sha }}" HEAD_REF="${{ github.sha }}"
          else
            make test-integration
          fi

  all-checks:
    needs:
      [
        static-analysis,
        unit-tests,
        race-tests,
        build,
        cgo-build-and-tests,
        integration-tests,
      ]
    runs-on: arc-runner-foxctl
    steps:
      - run: echo "✅ All checks passed"

  release:
    name: Release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [static-analysis, unit-tests, race-tests, build]
    runs-on: arc-runner-foxctl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
