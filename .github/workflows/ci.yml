name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  label-ai:
    runs-on: arc-runner-agentctl
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions-ecosystem/action-add-labels@v1
        if: startsWith(github.head_ref, 'codex/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ai-generated

  fmt:
    runs-on: arc-runner-agentctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format (gofumpt)
        run: |
          cd "$GITHUB_WORKSPACE"
          make fmt
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git diff --exit-code || (echo 'Formatting changed files. Run make fmt locally.' && exit 1)
          else
            echo 'No git repository metadata; skipping formatting diff check.'
          fi

  lint:
    runs-on: arc-runner-agentctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint (golangci-lint)
        env:
          GOTOOLCHAIN: go1.24.3
        run: make lint

  unit-tests:
    runs-on: arc-runner-agentctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests (no race)
        run: make test-short

  race-tests:
    runs-on: arc-runner-agentctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Race tests
        run: make test-race

  coverage:
    runs-on: arc-runner-agentctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Coverage
        run: |
          mkdir -p coverage
          CGO_ENABLED=1 go test -short ./... -covermode=atomic -coverprofile=coverage/coverage.out
          CGO_ENABLED=1 go tool cover -func=coverage/coverage.out | tee coverage/summary.txt
          awk '/total:/ { if ($3+0 < 40.0) { print "Coverage below threshold:", $3; exit 1 } }' coverage/summary.txt

  build:
    runs-on: arc-runner-agentctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build CLI
        run: make build

      - name: Build skills pack
        run: make skills-build

      - name: Check skill manifests (policy)
        run: go run ./scripts/checkmanifests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentctl-${{ runner.os }}-go1.24
          path: |
            bin/agentctl
            dist/skills/**

  e2e-tests:
    runs-on: arc-runner-agentctl
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x"]
        test:
          - TestFSReadCommandOutputsPreview
          - TestFSReadCommandRemember
          - TestEndToEndCacheMemoryWorkflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Run ${{ matrix.test }} (cmd/agentctl/cmd)
        run: |
          CGO_ENABLED=0 go test ./cmd/agentctl/cmd -run ^${{ matrix.test }}$ -count=1 -timeout 10m -v

  all-checks:
    needs: [lint, unit-tests, race-tests, coverage, build, e2e-tests]
    runs-on: arc-runner-agentctl
    steps:
      - run: echo "✅ All checks passed"

  release:
    name: Release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, unit-tests, race-tests, coverage, build]
    runs-on: arc-runner-agentctl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
