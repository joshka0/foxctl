name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/check_doc_links.sh'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/check_doc_links.sh'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-link-check:
    runs-on: arc-runner-agentctl
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check docs links
        run: make check-doc-links
