name: CI (local)

# Local-only workflow for agent-ci. Uses the local registry mirror
# localhost:5000/foxctl-ci:go1.26.1 instead of ghcr.io/${{ github.repository_owner }}/foxctl-ci:go1.26.1.
#
# Usage:
#   npx agent-ci run --workflow .github/workflows/ci-local.yml
#
# Build the CI image first:
#   docker build -t foxctl-ci:go1.26.1 -f Dockerfile.ci .
#   docker tag foxctl-ci:go1.26.1 localhost:5000/foxctl-ci:go1.26.1
#   docker push localhost:5000/foxctl-ci:go1.26.1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-local-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  GOCACHE: /tmp/go-build
  GOMODCACHE: /tmp/go-mod

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    container:
      image: localhost:5000/foxctl-ci:go1.26.1
      options: --memory=6g --memory-swap=6g --cpus=4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format (gofumpt)
        run: |
          export PATH=/usr/local/go/bin:/go/bin:$PATH
          cd "$GITHUB_WORKSPACE"
          before_diff="$(mktemp)"
          after_diff="$(mktemp)"
          git -c core.filemode=false diff --binary >"$before_diff" || true
          make fmt
          git -c core.filemode=false diff --binary >"$after_diff" || true
          if ! cmp -s "$before_diff" "$after_diff"; then
            echo 'Formatting changed files. Run make fmt locally.'
            exit 1
          fi

      - name: Lint (golangci-lint)
        run: export PATH=/usr/local/go/bin:/go/bin:$PATH && make lint

      - name: Check large files
        run: make check-large-files

      - name: Check tech debt (TODO/FIXME count)
        run: make check-tech-debt

  unit-tests:
    needs: [static-analysis]
    runs-on: ubuntu-latest
    container:
      image: localhost:5000/foxctl-ci:go1.26.1
      options: --memory=6g --memory-swap=6g --cpus=4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests
        run: |
          export PATH=/usr/local/go/bin:/go/bin:$PATH
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make test-short-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            CGO_ENABLED=0 go test -short -v -count=1 -timeout 20m ./...
          fi

  race-tests:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: localhost:5000/foxctl-ci:go1.26.1
      options: --memory=6g --memory-swap=6g --cpus=4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Race tests
        run: |
          export PATH=/usr/local/go/bin:/go/bin:$PATH
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make test-race-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            make test-race
          fi

  build:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    container:
      image: localhost:5000/foxctl-ci:go1.26.1
      options: --memory=6g --memory-swap=6g --cpus=4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build CLI
        run: export PATH=/usr/local/go/bin:/go/bin:$PATH && make build

      - name: Build skills pack
        run: |
          export PATH=/usr/local/go/bin:/go/bin:$PATH
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make skills-build-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            make skills-build
          fi

      - name: Check skill manifests (policy)
        run: export PATH=/usr/local/go/bin:/go/bin:$PATH && go run ./scripts/checkmanifests

  integration-tests:
    needs: [race-tests]
    runs-on: ubuntu-latest
    container:
      image: localhost:5000/foxctl-ci:go1.26.1
      options: --memory=6g --memory-swap=6g --cpus=4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run integration tests
        run: |
          export PATH=/usr/local/go/bin:/go/bin:$PATH
          base_ref=""
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            head_ref="$(git rev-parse HEAD)"
            main_ref="$(git rev-parse origin/main)"
            if [ "$head_ref" != "$main_ref" ]; then
              base_ref="$(git merge-base HEAD origin/main)"
            fi
          fi
          if [ -n "$base_ref" ]; then
            make test-integration-impacted BASE_REF="$base_ref" HEAD_REF=HEAD
          else
            make test-integration
          fi
