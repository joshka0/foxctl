name: CI (local)

# Local-only workflow for agent-ci. Uses the local agentctl-ci:go1.26.1 image
# instead of ghcr.io/${{ github.repository_owner }}/agentctl-ci:go1.26.1.
#
# Usage:
#   npx agent-ci run --workflow .github/workflows/ci-local.yml
#
# Build the CI image first:
#   docker build -t agentctl-ci:go1.26.1 -f Dockerfile.ci .

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-local-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  GOCACHE: /tmp/go-build
  GOMODCACHE: /tmp/go-mod

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends make gcc libc6-dev
          sudo mkdir -p /home/runner/.cache/go-build /home/runner/go/pkg/mod
          sudo chown -R runner:runner /home/runner/.cache /home/runner/go
          go install mvdan.cc/gofumpt@v0.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Format (gofumpt)
        run: |
          cd "$GITHUB_WORKSPACE"
          make fmt
          git -c core.filemode=false diff --exit-code || (echo 'Formatting changed files. Run make fmt locally.' && exit 1)

      - name: Lint (golangci-lint)
        run: make lint

      - name: Check large files
        run: make check-large-files

      - name: Check tech debt (TODO/FIXME count)
        run: make check-tech-debt

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Unit tests
        run: |
          sudo mkdir -p /home/runner/.cache/go-build
          sudo chown -R runner:runner /home/runner/.cache
          CGO_ENABLED=0 go test -short -v -count=1 ./...

  race-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends make gcc libc6-dev
          sudo mkdir -p /home/runner/.cache/go-build /home/runner/go/pkg/mod
          sudo chown -R runner:runner /home/runner/.cache /home/runner/go

      - name: Race tests
        run: make test-race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends make gcc libc6-dev
          sudo mkdir -p /home/runner/.cache/go-build /home/runner/go/pkg/mod
          sudo chown -R runner:runner /home/runner/.cache /home/runner/go

      - name: Build CLI
        run: make build

      - name: Build skills pack
        run: make skills-build

      - name: Check skill manifests (policy)
        run: go run ./scripts/checkmanifests

  cgo-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends make gcc libc6-dev libsqlite3-dev
          sudo mkdir -p /home/runner/.cache/go-build /home/runner/go/pkg/mod
          sudo chown -R runner:runner /home/runner/.cache /home/runner/go

      - name: Build CLI (CGO + libsqlite3)
        run: make build-cgo

      - name: Unit tests (CGO + libsqlite3)
        run: make test-cgo-short

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends make gcc libc6-dev
          sudo mkdir -p /home/runner/.cache/go-build /home/runner/go/pkg/mod
          sudo chown -R runner:runner /home/runner/.cache /home/runner/go

      - name: Run integration tests
        run: make test-integration
