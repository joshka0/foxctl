name: Sync to Forgejo

on:
  push:
    branches: ["*"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Forgejo
        run: |
          git remote add forgejo https://${{ secrets.FORGEJO_USER }}:${{ secrets.FORGEJO_TOKEN }}@git.katig.dev/jkatigb/agentctl.git
          git push forgejo ${{ github.ref_name }} --force
          git push forgejo --tags --force
