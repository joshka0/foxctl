# sqld - libSQL server for foxctl cross-machine sync
#
# Usage:
#   docker compose up -d
#
# Then migrate:
#   foxctl run libsql/migrate --input '{"libsql_url": "http://localhost:8080", "dry_run": true}'
#   foxctl run libsql/migrate --input '{"libsql_url": "http://localhost:8080"}'
#
# For Tailscale access, use Tailscale IP:
#   foxctl run libsql/migrate --input '{"libsql_url": "http://100.x.x.x:8080"}'

services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: foxctl-sqld
    ports:
      - "8080:8080"   # HTTP API
      - "5001:5001"   # gRPC (for replication)
    volumes:
      - sqld-data:/var/lib/sqld
    environment:
      # Optional: Set auth token for production
      # SQLD_AUTH_JWT_KEY_FILE: /etc/sqld/jwt.key
      SQLD_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
      SQLD_GRPC_LISTEN_ADDR: "0.0.0.0:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  sqld-data:
    driver: local
