# Core agentctl deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentctl
  namespace: agentctl
  labels:
    app.kubernetes.io/name: agentctl
    app.kubernetes.io/component: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agentctl
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentctl
        app.kubernetes.io/component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agentctl
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
      - name: agentctl
        image: agentctl:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: health
          containerPort: 8080
          protocol: TCP

        # Configuration from ConfigMap
        envFrom:
        - configMapRef:
            name: agentctl-config

        env:
        # Secrets
        - name: TURSO_URL
          valueFrom:
            secretKeyRef:
              name: agentctl-secrets
              key: turso-url
        - name: TURSO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentctl-secrets
              key: turso-token
        - name: VOYAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: agentctl-secrets
              key: voyage-key
        - name: AGENTCTL_OAUTH_ENC_KEY
          valueFrom:
            secretKeyRef:
              name: agentctl-secrets
              key: oauth-enc-key
              optional: true

        # Pod identity for distributed coordination
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Observability directory
        - name: AGENTCTL_OBS_DIR
          value: "/var/log/agentctl"

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        livenessProbe:
          exec:
            command: ["agentctl", "health"]
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command: ["agentctl", "health", "--ready"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        lifecycle:
          preStop:
            exec:
              command: ["agentctl", "drain"]

        volumeMounts:
        - name: cache
          mountPath: /var/cache/agentctl
        - name: logs
          mountPath: /var/log/agentctl
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: logs
        emptyDir:
          sizeLimit: 500Mi
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: agentctl
              topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: agentctl
