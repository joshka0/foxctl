# Scheduled jobs for foxctl maintenance

---
# PageRank recalculation for task prioritization
apiVersion: batch/v1
kind: CronJob
metadata:
  name: foxctl-pagerank
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 * * * *"  # Every hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: foxctl
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: foxctl
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000

          containers:
          - name: pagerank
            image: foxctl:latest
            command:
            - foxctl
            - overseer
            - rerank

            env:
            - name: AGENTCTL_DB_DRIVER
              value: "turso"
            - name: TURSO_URL
              valueFrom:
                secretKeyRef:
                  name: foxctl-secrets
                  key: turso-url
            - name: TURSO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foxctl-secrets
                  key: turso-token

            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true

            volumeMounts:
            - name: tmp
              mountPath: /tmp

          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 100Mi

---
# CAS garbage collection
apiVersion: batch/v1
kind: CronJob
metadata:
  name: foxctl-cas-gc
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: foxctl
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: foxctl
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000

          containers:
          - name: gc
            image: foxctl:latest
            command:
            - foxctl
            - cas
            - gc
            args:
            - --max-age=168h  # 7 days
            - --dry-run=false

            env:
            - name: AGENTCTL_DB_DRIVER
              value: "turso"
            - name: TURSO_URL
              valueFrom:
                secretKeyRef:
                  name: foxctl-secrets
                  key: turso-url
            - name: TURSO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foxctl-secrets
                  key: turso-token
            - name: AGENTCTL_CAS_BACKEND
              value: "s3"
            - name: AGENTCTL_CAS_BUCKET
              value: "foxctl-cas"

            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "500m"

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true

            volumeMounts:
            - name: tmp
              mountPath: /tmp

          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 100Mi

---
# Session cleanup (old terminated sessions)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: foxctl-session-cleanup
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: cronjob
spec:
  schedule: "30 4 * * 0"  # Weekly on Sunday at 4:30 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: foxctl
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: foxctl
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000

          containers:
          - name: cleanup
            image: foxctl:latest
            command:
            - foxctl
            - sessions
            - cleanup
            args:
            - --older-than=720h  # 30 days
            - --status=ok,error,canceled

            env:
            - name: AGENTCTL_DB_DRIVER
              value: "turso"
            - name: TURSO_URL
              valueFrom:
                secretKeyRef:
                  name: foxctl-secrets
                  key: turso-url
            - name: TURSO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foxctl-secrets
                  key: turso-token

            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true

            volumeMounts:
            - name: tmp
              mountPath: /tmp

          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 100Mi
