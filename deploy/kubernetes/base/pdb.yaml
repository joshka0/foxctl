# Pod Disruption Budgets for high availability

---
# Core foxctl deployment
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: foxctl
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foxctl
      app.kubernetes.io/component: core

---
# Embedding workers (allow all to be disrupted since work is queued)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: foxctl-embedding-worker
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: embedding-worker
spec:
  maxUnavailable: "50%"
  selector:
    matchLabels:
      app.kubernetes.io/name: foxctl
      app.kubernetes.io/component: embedding-worker
