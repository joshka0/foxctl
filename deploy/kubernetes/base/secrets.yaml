# Secrets for foxctl deployment
# IMPORTANT: Replace placeholder values before applying
# Consider using external secrets management (Vault, AWS Secrets Manager, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: foxctl-secrets
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Turso database credentials
  turso-url: "libsql://your-database.turso.io"
  turso-token: "your-turso-auth-token"
  # OAuth AuthBroker encryption key (Plan 05)
  oauth-enc-key: "replace-with-openssl-rand-base64-32-output"

  # OpenAI-compatible embedding/rerank endpoints. API key is optional for local endpoints.
  embedding-base-url: "http://embedding-service:1234/v1"
  embedding-api-key: ""
  rerank-base-url: "http://rerank-service:8000/v1"
  rerank-api-key: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: git-creds
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  username: "git"
  token: "ghp_your_github_personal_access_token"
