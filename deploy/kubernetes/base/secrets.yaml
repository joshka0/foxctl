# Secrets for agentctl deployment
# IMPORTANT: Replace placeholder values before applying
# Consider using external secrets management (Vault, AWS Secrets Manager, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: agentctl-secrets
  namespace: agentctl
  labels:
    app.kubernetes.io/name: agentctl
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Turso database credentials
  turso-url: "libsql://your-database.turso.io"
  turso-token: "your-turso-auth-token"
  # OAuth AuthBroker encryption key (Plan 05)
  oauth-enc-key: "replace-with-openssl-rand-base64-32-output"

  # Embedding provider API keys (at least one required for semantic search)
  voyage-key: "your-voyage-api-key"
  # gemini-key: "your-gemini-api-key"
  # mistral-key: "your-mistral-api-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: git-creds
  namespace: agentctl
  labels:
    app.kubernetes.io/name: agentctl
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  username: "git"
  token: "ghp_your_github_personal_access_token"
