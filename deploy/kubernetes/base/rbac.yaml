# RBAC configuration for foxctl

apiVersion: v1
kind: ServiceAccount
metadata:
  name: foxctl
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: rbac

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foxctl
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: rbac
rules:
# Read configmaps for configuration
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

# Read specific secrets
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["foxctl-secrets", "git-creds"]
  verbs: ["get"]

# Read pod info for distributed coordination
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foxctl
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: foxctl
  namespace: foxctl
roleRef:
  kind: Role
  name: foxctl
  apiGroup: rbac.authorization.k8s.io
