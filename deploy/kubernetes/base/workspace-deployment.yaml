# Workspace deployment with git-sync sidecar
# Use this template for read-only workspace access

apiVersion: apps/v1
kind: Deployment
metadata:
  name: foxctl-workspace
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foxctl
      app.kubernetes.io/component: workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foxctl
        app.kubernetes.io/component: workspace
      annotations:
        # Customize these for your repository
        foxctl.io/repo: "https://github.com/org/repo"
        foxctl.io/branch: "main"
    spec:
      serviceAccountName: foxctl
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 5Gi
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: logs
        emptyDir:
          sizeLimit: 500Mi
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi

      containers:
      # Main foxctl container
      - name: foxctl
        image: foxctl:latest
        imagePullPolicy: IfNotPresent

        env:
        # Workspace path (git-sync creates 'current' symlink)
        - name: FOXCTL_WORKSPACE
          value: "/workspace/current"

        # Database configuration
        - name: FOXCTL_DB_DRIVER
          value: "turso"
        - name: TURSO_URL
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: turso-url
        - name: TURSO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: turso-token

        # Embedding provider
        - name: FOXCTL_EMBEDDING_PROVIDER
          value: "openai_compat"
        - name: FOXCTL_EMBEDDING_MODEL
          value: "text-embedding-qwen3-embedding-8b"
        - name: FOXCTL_EMBEDDING_BASE_URL
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: embedding-base-url
              optional: true
        - name: FOXCTL_EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: embedding-api-key
              optional: true
        - name: FOXCTL_RERANK_PROVIDER
          value: "qwen"
        - name: FOXCTL_RERANK_BASE_URL
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: rerank-base-url
              optional: true
        - name: FOXCTL_RERANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: rerank-api-key
              optional: true

        # Pod identity
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        # Observability
        - name: FOXCTL_OBS_DIR
          value: "/var/log/foxctl"

        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
        - name: cache
          mountPath: /var/cache/foxctl
        - name: logs
          mountPath: /var/log/foxctl
        - name: tmp
          mountPath: /tmp

        livenessProbe:
          exec:
            command: ["foxctl", "health"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5

        readinessProbe:
          exec:
            command: ["foxctl", "health", "--ready"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3

      # Git-sync sidecar for repository synchronization
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.2.1
        args:
        # Repository configuration - CUSTOMIZE THESE
        - --repo=https://github.com/org/repo
        - --ref=main
        - --root=/workspace
        - --link=current

        # Sync settings
        - --period=30s
        - --depth=1
        - --one-time=false

        # Logging
        - --v=2

        env:
        # Git credentials
        - name: GITSYNC_USERNAME
          valueFrom:
            secretKeyRef:
              name: git-creds
              key: username
        - name: GITSYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: git-creds
              key: token

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
