# Configuration for foxctl deployment

apiVersion: v1
kind: ConfigMap
metadata:
  name: foxctl-config
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: config
data:
  # Database configuration
  FOXCTL_DB_DRIVER: "turso"

  # CAS configuration
  FOXCTL_CAS_DRIVER: "s3"
  FOXCTL_CAS_S3_BUCKET: "foxctl-cas"
  FOXCTL_CAS_S3_REGION: "us-west-2"

  # Observability
  FOXCTL_OBS_SAMPLE_RATE: "0.05"
  FOXCTL_OBS_SLOW_THRESHOLD_MS: "1000"
  FOXCTL_OBS_SAMPLE_ERRORS: "true"

  # Actor system tuning
  FOXCTL_MAILBOX_POLL_INTERVAL: "50ms"
  FOXCTL_ACTOR_LEASE_DURATION: "30s"

  # Embedding configuration
  FOXCTL_EMBEDDING_BATCH_SIZE: "100"
  FOXCTL_EMBEDDING_CONCURRENCY: "5"
