# Embedding worker deployment
# Processes embedding jobs from the queue

apiVersion: apps/v1
kind: Deployment
metadata:
  name: foxctl-embedding-worker
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: embedding-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: foxctl
      app.kubernetes.io/component: embedding-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foxctl
        app.kubernetes.io/component: embedding-worker
    spec:
      serviceAccountName: foxctl
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
      - name: worker
        image: foxctl:latest
        imagePullPolicy: IfNotPresent

        command:
        - foxctl
        - worker
        - embeddings
        args:
        - --concurrency=5
        - --batch-size=100
        - --idle-timeout=60s

        env:
        # Database configuration
        - name: FOXCTL_DB_DRIVER
          value: "turso"
        - name: TURSO_URL
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: turso-url
        - name: TURSO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: turso-token

        # Embedding providers
        - name: VOYAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: foxctl-secrets
              key: voyage-key

        # Pod identity
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        # Observability
        - name: FOXCTL_OBS_DIR
          value: "/var/log/foxctl"

        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: cache
          mountPath: /var/cache/foxctl
        - name: logs
          mountPath: /var/log/foxctl
        - name: tmp
          mountPath: /tmp

        livenessProbe:
          exec:
            command: ["foxctl", "health"]
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 5

      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: logs
        emptyDir:
          sizeLimit: 500Mi
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi

---
# HPA for embedding workers based on queue depth
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foxctl-embedding-worker
  namespace: foxctl
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: embedding-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: foxctl-embedding-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
