apiVersion: apps/v1
kind: Deployment
metadata:
  name: gui-auth-gateway
  labels:
    app.kubernetes.io/name: foxctl
    app.kubernetes.io/component: gui-auth-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: foxctl
      app.kubernetes.io/component: gui-auth-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foxctl
        app.kubernetes.io/component: gui-auth-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: gui-auth-gateway
        image: foxctl-gui-auth-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: gui-auth-gateway-config
        env:
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: gui-auth-gateway-secrets
              key: better-auth-secret
        - name: GUI_AUTH_SMTP_USER
          valueFrom:
            secretKeyRef:
              name: gui-auth-gateway-secrets
              key: smtp-user
              optional: true
        - name: GUI_AUTH_SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: gui-auth-gateway-secrets
              key: smtp-pass
              optional: true
        - name: AGENTCTL_POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: dsn
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
