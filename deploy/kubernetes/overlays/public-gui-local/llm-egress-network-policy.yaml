apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentctl-llm-egress-local
  labels:
    app.kubernetes.io/name: agentctl
    app.kubernetes.io/component: local-llm-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentctl
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.250.250.254/32
    ports:
    - protocol: TCP
      port: 1235
