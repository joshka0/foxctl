# Patch ConfigMap to use PostgreSQL driver
apiVersion: v1
kind: ConfigMap
metadata:
  name: foxctl-config
  namespace: foxctl
data:
  # Override database driver to PostgreSQL
  FOXCTL_DB_DRIVER: "postgres"

  # Connection pool settings
  FOXCTL_POSTGRES_MAX_CONNS: "5"

  # Require pgvector extension (fail fast if missing)
  FOXCTL_POSTGRES_REQUIRE_VECTOR: "true"

  # CAS configuration (S3)
  FOXCTL_CAS_DRIVER: "s3"
  FOXCTL_CAS_S3_BUCKET: "foxctl-cas"
  AWS_REGION: "us-west-2"
