# PostgreSQL connection secrets
# IMPORTANT: Replace placeholder values before applying.
# Consider using ExternalSecrets or Sealed Secrets in production.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: agentctl
  labels:
    app.kubernetes.io/name: agentctl
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # PostgreSQL DSN (required)
  # For RDS: postgres://user:pass@my-rds-instance.region.rds.amazonaws.com:5432/agentctl?sslmode=require
  # For local: postgres://postgres:dev@postgres:5432/agentctl?sslmode=disable
  dsn: "postgres://agentctl:CHANGE_ME@your-rds-instance.region.rds.amazonaws.com:5432/agentctl?sslmode=require"
