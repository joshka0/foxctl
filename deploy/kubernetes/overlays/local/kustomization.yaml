# Local k3s testing overlay
# Usage: kubectl apply -k deploy/kubernetes/overlays/local/
#
# Uses a single-replica, PVC-backed local store:
# - Keeps all runtime state inside the OrbStack cluster
# - Persists local state across pod restarts
# - Avoids sharing workspace/session metadata with other environments
# - Reduces replicas to 1
# - Uses locally-built Docker image (imagePullPolicy: Never)
# - Disables S3 CAS (uses file-based local storage)
# - Uses local SQLite/Turso files only; no remote DB sync
# - Removes embedding worker and suspends cronjobs (state is pod-local)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- local-storage.yaml

patches:
# Local deployment adjustments
- path: patches.yaml
- target:
    kind: Deployment
    name: foxctl
  patch: |
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: cache
        persistentVolumeClaim:
          claimName: foxctl-local-cache
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe
      value:
        httpGet:
          path: /healthz
          port: health
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe
      value:
        httpGet:
          path: /readyz
          port: health
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3

# Override secrets with local values
- path: secrets.yaml

# Scale down embedding worker to 0
- target:
    kind: Deployment
    name: foxctl-embedding-worker
  patch: |
    - op: replace
      path: /spec/replicas
      value: 0

# Remove HPA for embedding worker (0 replicas)
- target:
    kind: HorizontalPodAutoscaler
    name: foxctl-embedding-worker
  patch: |
    $patch: delete
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: foxctl-embedding-worker

# Remove HPA for main deployment (single replica)
- target:
    kind: HorizontalPodAutoscaler
    name: foxctl
  patch: |
    $patch: delete
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: foxctl

# Remove PDB (single replica)
- target:
    kind: PodDisruptionBudget
    name: foxctl
  patch: |
    $patch: delete
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: foxctl

# Suspend cronjobs in local mode. They run as separate pods and should not
# point at the pod-local DB files used by the single-replica dev server.
- target:
    kind: CronJob
    name: foxctl-pagerank
  patch: |
    - op: add
      path: /spec/suspend
      value: true
- target:
    kind: CronJob
    name: foxctl-cas-gc
  patch: |
    - op: add
      path: /spec/suspend
      value: true
- target:
    kind: CronJob
    name: foxctl-session-cleanup
  patch: |
    - op: add
      path: /spec/suspend
      value: true
