# Local deployment patches for k3s testing

# Reduce foxctl to single replica
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foxctl
  namespace: foxctl
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: foxctl
        # Use locally-built image (OrbStack k3s shares Docker daemon)
        imagePullPolicy: Never
        # Create storage dirs in the local PVC, then start the web server.
        command: ["sh", "-c"]
        args:
        - |
          mkdir -p /var/cache/foxctl/storage /var/cache/foxctl/cas
          exec foxctl-cgo web serve --port=8080
        # Override CAS to use file-based (emptyDir) instead of S3
        env:
        - name: HOME
          value: "/var/cache/foxctl"
        - name: AGENTCTL_HOME
          value: "/var/cache/foxctl"
        - name: AGENTCTL_STORAGE_ROOT
          value: "/var/cache/foxctl/storage"
        - name: AGENTCTL_DB_DRIVER
          value: "sqlite"
        - name: AGENTCTL_V2_EVENTS_DB_DRIVER
          value: "sqlite"
        - name: AGENTCTL_CAS_BACKEND
          value: "file"
        - name: AGENTCTL_CAS_ROOT
          value: "/var/cache/foxctl/cas"
        lifecycle:
          preStop:
            exec:
              command: ["foxctl-cgo", "drain"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # Remove topology constraints for single-node
      topologySpreadConstraints: []
      affinity: {}
