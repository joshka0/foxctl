# Local secret overrides for k3s testing
# These replace the placeholder values from base/secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: agentctl-secrets
  namespace: agentctl
type: Opaque
stringData:
  # Not used with the local libsql driver, but still referenced by base env vars.
  turso-url: "unused"
  turso-token: "unused"
  # No Voyage key for basic local testing (embedding worker scaled to 0)
  voyage-key: "unused"
