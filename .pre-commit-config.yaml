repos:
  - repo: local
    hooks:
      - id: strict-pre-commit
        name: strict pre-commit checks
        entry: scripts/pre_commit_strict.sh
        language: script
        always_run: true
        pass_filenames: false

      - id: check-doc-links
        name: check doc links
        entry: bash scripts/check_doc_links.sh
        language: system
        pass_filenames: false
        files: '\.md$'
